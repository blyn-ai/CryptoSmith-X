<!-- @dsCard group="Spacing" viewport="700x150" subtitle="The fixed slots inside a cell, in order" name="Cell furniture" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-page)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .sw{display:flex;flex-direction:column;gap:5px;min-width:104px}
  .chip{height:34px;display:flex;align-items:flex-end;padding:4px 6px}
  .k{font:500 9px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}
  .v{font:400 9px/1.2 var(--font-mono);color:var(--text-faint)}
  .cell{padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;background:var(--surface-card);border:1px solid var(--border-hairline);min-width:104px}
  .n{font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)}
  .age{font:400 8.5px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-faint)}
  .lbl{font:500 9px/1 var(--font-mono);letter-spacing:.17em;text-transform:uppercase}
</style></head><body>
<div class="row" style="gap:18px;align-items:flex-start">
<div class="cell"><div style="height:12px;display:flex;align-items:center"><span class="lbl" style="color:var(--tag-best-ink);background:var(--tag-best-bg);padding:2px 5px">Best</span></div><div class="n">1,820</div><div style="width:60px;height:3px;background:var(--tint-neutral)"><i style="display:block;height:3px;width:74%;background:var(--bar-ticker)"></i></div><div class="age">3 s ago</div></div>
<div class="col" style="gap:4px">
<div class="v">12px — BEST slot, reserved whether or not the mark is there</div>
<div class="v">12px figure</div>
<div class="v">60×3 bar, or 60×11 hourly line</div>
<div class="v">8.5px age, in a 66px slot so it never reflows</div>
</div>
</div></body></html>
