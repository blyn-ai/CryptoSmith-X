<!-- @dsCard group="Brand" viewport="700x220" name="Wordmark lockup" subtitle="Live text, never an image — Space Grotesk 600, X violet" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--surface-page);display:flex;align-items:center;justify-content:center;gap:44px}
.lock{display:inline-flex;flex-direction:column}
.lock b{font:600 42px/1.05 var(--font-display);color:var(--text-heading);letter-spacing:-.01em}
.lock b i{font-style:normal;color:var(--violet-400)}
.lock span{display:flex;justify-content:space-between;font:500 15px var(--font-mono);letter-spacing:.1em;color:var(--text-muted);margin-top:6px}
.note{font:var(--type-mono);color:var(--text-muted);max-width:30ch}</style></head><body>
<div class="lock"><b>CryptoSmith <i>X</i></b><span><u style="text-decoration:none">PERPS &amp; CRYPTO</u><u style="text-decoration:none">TRADE BOT</u></span></div>
<p class="note">Descriptor: IBM Plex Mono, ~0.4× title size, .1em tracking, space-between across the full title width. On dark ink the X uses violet-400; on paper #6B4EDB.</p>
</body></html>
