<!-- @dsCard group="Colors" viewport="700x150" name="Ink surfaces" subtitle="Violet-tinted blacks — page, card, raised, sunken, plate" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{display:flex;gap:10px;padding:14px;background:var(--surface-page)}
.sw{flex:1;border:1px solid var(--border-card);border-radius:var(--radius-sm);padding:10px;height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.sw u{text-decoration:none;font:var(--type-eyebrow);letter-spacing:.1em;color:var(--text-muted)}
.sw b{font:500 11px var(--font-mono);color:var(--text-data)}</style></head><body>
<div class="sw" style="background:var(--ink-950)"><u>--surface-sunken</u><b>#050408</b></div>
<div class="sw" style="background:var(--ink-900)"><u>--surface-page</u><b>#07060B</b></div>
<div class="sw" style="background:var(--ink-850)"><u>--surface-plate</u><b>#0A0812</b></div>
<div class="sw" style="background:var(--ink-800)"><u>--surface-card</u><b>#0D0B14</b></div>
<div class="sw" style="background:var(--ink-700)"><u>--surface-raised</u><b>#12101C</b></div>
<div class="sw" style="background:var(--ink-600)"><u>--ink-600</u><b>#1A1726</b></div>
</body></html>
