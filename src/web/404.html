<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — CryptoSmith X</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#050408; --ink-900:#07060B;
    --gold-400:#F5B84F; --violet-400:#A18AFF;
    --lilac-100:#EFEAF7; --lilac-300:#BDB2D6; --lilac-500:#7C7391;
    --font-display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:24px; display:grid; place-items:center; text-align:center;
    background:var(--ink-900); color:var(--lilac-300);
    font:400 14.5px/1.6 var(--font-body); -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(820px 520px at 2% 0%,rgba(245,184,79,.10),transparent 66%),
      radial-gradient(820px 620px at 100% 100%,rgba(107,78,219,.22),transparent 70%);
  }
  main{position:relative; max-width:440px}
  .code{
    margin:0; font:500 11px/1 var(--font-mono); letter-spacing:.20em;
    text-transform:uppercase; color:var(--gold-400);
  }
  h1{
    margin:16px 0 0; font:600 clamp(30px,6vw,42px)/1.1 var(--font-display);
    letter-spacing:-.03em; color:var(--lilac-100);
  }
  p{margin:16px 0 0; color:var(--lilac-500)}
  a{
    display:inline-block; margin:26px 0 0; color:var(--violet-400);
    text-decoration:none; border-bottom:1px solid rgba(161,138,255,.3);
  }
  a:hover{color:#DCD3F5; border-bottom-color:#DCD3F5}
  a:focus-visible{outline:2px solid var(--violet-400); outline-offset:3px}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Puslapis nerastas</h1>
    <p>Tokio puslapio nėra arba jis buvo perkeltas.</p>
    <a href="/">Grįžti į pradžią</a>
  </main>
</body>
</html>
