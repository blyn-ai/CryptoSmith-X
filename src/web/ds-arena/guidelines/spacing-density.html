<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Row 66px, eyebrow 34px, band 24px, cell padding 8/10" name="Table density" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-page)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .sw{display:flex;flex-direction:column;gap:5px;min-width:104px}
  .chip{height:34px;display:flex;align-items:flex-end;padding:4px 6px}
  .k{font:500 9px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}
  .v{font:400 9px/1.2 var(--font-mono);color:var(--text-faint)}
  .cell{padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;background:var(--surface-card);border:1px solid var(--border-hairline);min-width:104px}
  .n{font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)}
  .age{font:400 8.5px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-faint)}
  .lbl{font:500 9px/1 var(--font-mono);letter-spacing:.17em;text-transform:uppercase}
</style></head><body>
<div class="col">
<div style="display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--border-hairline)">
<div style="grid-column:1/-1;height:24px;background:var(--band-ticker);color:var(--band-ink);font:500 9px/24px var(--font-mono);letter-spacing:.17em;text-transform:uppercase;padding:0 10px">Band · 24px</div>
<div style="grid-column:1/-1;height:34px;background:var(--surface-sunken);font:500 9px/34px var(--font-mono);letter-spacing:.17em;text-transform:uppercase;color:var(--eyebrow);padding:0 10px">Eyebrow · 34px</div>
<div style="grid-column:1/-1;height:66px;background:var(--surface-card);font:400 9px/66px var(--font-mono);color:var(--text-faint);padding:0 10px">Row · 66px · cell padding 8px 10px</div>
</div>
</div></body></html>
