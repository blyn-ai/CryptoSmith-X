<!-- @dsCard group="Type" viewport="700x170" subtitle="Every figure, label, state and age" name="Mono — DM Mono" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-page)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .sw{display:flex;flex-direction:column;gap:5px;min-width:104px}
  .chip{height:34px;display:flex;align-items:flex-end;padding:4px 6px}
  .k{font:500 9px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}
  .v{font:400 9px/1.2 var(--font-mono);color:var(--text-faint)}
  .cell{padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;background:var(--surface-card);border:1px solid var(--border-hairline);min-width:104px}
  .n{font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)}
  .age{font:400 8.5px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-faint)}
  .lbl{font:500 9px/1 var(--font-mono);letter-spacing:.17em;text-transform:uppercase}
</style></head><body>
<div class="col">
<div class="row" style="gap:22px">
<div class="sw" style="min-width:150px"><div style="font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)">98,102.50</div><div class="v">12px · figure</div></div>
<div class="sw" style="min-width:150px"><div class="lbl" style="color:var(--kind-perp)">Perp · tight · best</div><div class="v">9px · .17em · label</div></div>
<div class="sw" style="min-width:150px"><div class="age">3 s ago · △ 94 s ago</div><div class="v">8.5px · age</div></div>
</div>
<p class="v" style="margin:4px 0 0;max-width:70ch">Tabular always. The ladder — 12 / 9 / 8.5 — is what puts twenty fields per venue on one desktop screen; the age is the smallest type because it describes the figure above it.</p>
</div></body></html>
