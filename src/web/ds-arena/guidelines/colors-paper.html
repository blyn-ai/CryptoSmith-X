<!-- @dsCard group="Colors" viewport="700x150" subtitle="The apricot register: page, card, sunken, and the four text rungs" name="Paper and ink" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-page)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .sw{display:flex;flex-direction:column;gap:5px;min-width:104px}
  .chip{height:34px;display:flex;align-items:flex-end;padding:4px 6px}
  .k{font:500 9px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}
  .v{font:400 9px/1.2 var(--font-mono);color:var(--text-faint)}
  .cell{padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;background:var(--surface-card);border:1px solid var(--border-hairline);min-width:104px}
  .n{font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)}
  .age{font:400 8.5px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-faint)}
  .lbl{font:500 9px/1 var(--font-mono);letter-spacing:.17em;text-transform:uppercase}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--surface-page);border:1px solid var(--border-hairline)"></div><div class="k">Page</div><div class="v">#FFDFAF</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-card);border:1px solid var(--border-hairline)"></div><div class="k">Card</div><div class="v">#FFF3DE</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-sunken);border:1px solid var(--border-hairline)"></div><div class="k">Sunken</div><div class="v">#FFE7C4</div></div>
<div class="sw"><div class="chip" style="background:var(--text-data)"></div><div class="k">Data ink</div><div class="v">#1E1408</div></div>
<div class="sw"><div class="chip" style="background:var(--text-body)"></div><div class="k">Body</div><div class="v">#3A2A16</div></div>
<div class="sw"><div class="chip" style="background:var(--text-muted)"></div><div class="k">Muted</div><div class="v">#6B5230</div></div>
<div class="sw"><div class="chip" style="background:var(--text-faint)"></div><div class="k">Faint</div><div class="v">#7A5F3C</div></div>
</div></body></html>
