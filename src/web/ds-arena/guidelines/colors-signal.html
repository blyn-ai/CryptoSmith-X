<!-- @dsCard group="Colors" viewport="700x150" subtitle="Acid green is a fill and stays rare; pink is the only alarm" name="Acid, alarm, accent" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-page)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .sw{display:flex;flex-direction:column;gap:5px;min-width:104px}
  .chip{height:34px;display:flex;align-items:flex-end;padding:4px 6px}
  .k{font:500 9px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}
  .v{font:400 9px/1.2 var(--font-mono);color:var(--text-faint)}
  .cell{padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;background:var(--surface-card);border:1px solid var(--border-hairline);min-width:104px}
  .n{font:400 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-data)}
  .age{font:400 8.5px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-faint)}
  .lbl{font:500 9px/1 var(--font-mono);letter-spacing:.17em;text-transform:uppercase}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--brand)"></div><div class="k">Acid</div><div class="v">#8BFF6B</div></div>
<div class="sw"><div class="chip" style="background:var(--state-stale)"></div><div class="k">Alarm</div><div class="v">#FF4BD8</div></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="k">Accent</div><div class="v">#B0007F</div></div>
<div class="sw"><div class="chip" style="background:var(--tag-best-bg);display:flex;align-items:center;justify-content:center;color:var(--tag-best-ink);font:600 8.5px/1 var(--font-mono);letter-spacing:.14em"></div><div class="k">Best chip</div><div class="v">acid + ink</div></div>
</div>
<p class="v" style="margin:12px 0 0;max-width:64ch">Acid green appears in three places on a whole page: the rule above the header, the BEST chip, the brand mark. At 1.6:1 on apricot it can never be text.</p></body></html>
