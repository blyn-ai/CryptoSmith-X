  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  src:url(\"c6dde251-bd2a-44c0-a0b7-253fa829ec41\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* IBM Plex Sans 500 · latin */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;\n  src:url(\"93c16b72-ceae-4638-84b2-e353bc6b8fa7\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n/* IBM Plex Sans 600 · latin-ext */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;\n  src:url(\"0e0b4730-5453-44e3-9e60-59e5a06adda1\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* IBM Plex Sans 600 · latin */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;\n  src:url(\"92bb5a39-60a9-47d4-9598-2ee08ad282c7\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n/* Space Grotesk 300 700 · latin-ext */\n@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;\n  src:url(\"b088af59-9066-4368-94f9-058c7c732d9b\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* Space Grotesk 300 700 · latin */\n@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;\n  src:url(\"ac337ec9-851e-4481-8117-3767e38e3bd4\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — colour system. Dark-only (\"forge\") theme.\n   Two brand axes inherited from BlynAI: VIOLET (AI / action) leads on ink,\n   GOLD (signal / brand) is reserved for the mark, live states and key numbers.\n   Market colours (green/red) exist ONLY for PnL and direction — never decorative. */\n:root{\n/* --- base: violet axis --- */\n--violet-100:#EFEAF7;--violet-200:#DCD3F5;--violet-300:#BDB2D6;--violet-400:#A18AFF;--violet-500:#8C6BC9;--violet-600:#8360C4;--violet-700:#6B4EDB;--violet-800:#5B3FC4;\n/* --- base: gold axis (brand signal) --- */\n--gold-200:#F7E6C1;--gold-300:#FFD987;--gold-400:#F5B84F;--gold-600:#C8963B;--gold-700:#B97F2E;\n/* --- base: ink (violet-tinted blacks) --- */\n--ink-950:#050408;--ink-900:#07060B;--ink-850:#0A0812;--ink-800:#0D0B14;--ink-700:#12101C;--ink-600:#1A1726;\n/* --- base: neutral text on violet ink --- */\n--lilac-100:#EFEAF7;--lilac-200:#DCD3F5;--lilac-300:#BDB2D6;--lilac-500:#7C7391;--lilac-700:#4A4358;\n--sand-200:#C8BBA6; /* warm mono data, the one warm neutral */\n/* --- base: market direction --- */\n--up-300:#7FE0B5;--up-500:#41C98F;--up-700:#2E9A6C;\n--down-300:#FF8A97;--down-500:#EF5D6F;--down-700:#C23D4E;\n\n/* --- semantic: surfaces --- */\n--surface-page:var(--ink-900);\n--surface-card:var(--ink-800);\n--surface-raised:var(--ink-700);\n--surface-sunken:var(--ink-950);\n--surface-overlay:rgba(5,4,8,.78);\n--surface-glass:rgba(161,138,255,.06);\n--surface-plate:var(--ink-850); /* logo plate, coin */\n/* --- semantic: text --- */\n--text-heading:var(--lilac-100);\n--text-body:var(--lilac-300);\n--text-muted:var(--lilac-500);\n--text-faint:var(--lilac-700);\n--text-data:var(--sand-200);\n--text-on-action:#FFFFFF;\n--text-on-gold:var(--ink-900);\n/* --- semantic: accents & actions --- */\n--accent:var(--violet-400);\n--accent-strong:var(--violet-700);\n--accent-gold:var(--gold-400);\n--action-primary:var(--violet-700);\n--action-primary-hover:var(--violet-800);\n--live:var(--gold-400);\n--eyebrow:var(--lilac-500);\n/* --- semantic: links --- */\n--link:var(--violet-400);\n--link-hover:var(--violet-200);\n/* --- semantic: borders --- */\n--border-hairline:rgba(161,138,255,.11);\n--border-card:rgba(161,138,255,.13);\n--border-strong:rgba(161,138,255,.28);\n--border-input:rgba(161,138,255,.22);\n--border-gold:rgba(245,184,79,.3);\n/* --- semantic: market --- */\n--pnl-up:var(--up-500);\n--pnl-down:var(--down-500);\n--long:var(--up-500);\n--short:var(--down-500);\n--tint-up:rgba(65,201,143,.11);\n--tint-down:rgba(239,93,111,.11);\n/* --- semantic: tints (badge/tag fills) --- */\n--tint-violet:rgba(161,138,255,.13);\n--tint-gold:rgba(245,184,79,.11);\n--tint-neutral:rgba(124,115,145,.15);\n/* --- semantic: status --- */\n--status-ok:var(--up-500);\n--status-warn:var(--gold-400);\n--status-error:var(--down-500);\n--status-off:var(--lilac-700);\n\n/* --- gradients: the brand's one recurring device, gold meets violet --- */\n--gradient-rule:linear-gradient(90deg,#F5B84F,#C98F63 42%,#8C6BC9 74%,#6B4EDB); /* @kind color */\n--gradient-text:linear-gradient(96deg,#F5B84F,#A18AFF); /* @kind color */\n--gradient-curve:linear-gradient(to right,#F5B84F,#C98F63 55%,#6B4EDB); /* @kind color */\n--gradient-divider-v:linear-gradient(180deg,rgba(245,184,79,.5),rgba(107,78,219,.45)); /* @kind color */\n/* --- washes: soft field light, gold NW / violet SE, always faint --- */\n--wash-gold:radial-gradient(820px 520px at 2% 0%,rgba(245,184,79,.10),transparent 66%); /* @kind color */\n--wash-violet:radial-gradient(820px 620px at 100% 100%,rgba(107,78,219,.22),transparent 70%); /* @kind color */\n}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — typography.\n   Three faces, three jobs: Space Grotesk = display, headings, buttons, nav.\n   IBM Plex Sans = running prose. IBM Plex Mono = every eyebrow, label and number. */\n:root{\n--font-display:\"Space Grotesk\",\"Helvetica Neue\",Arial,sans-serif;\n--font-body:\"IBM Plex Sans\",system-ui,-apple-system,sans-serif;\n--font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n\n/* --- size scale --- */\n--fs-micro:10px; /* @kind font */     /* mono eyebrow, badges */\n--fs-eyebrow:11px; /* @kind font */   /* mono eyebrow, nav */\n--fs-caption:12px; /* @kind font */\n--fs-data:12.5px; /* @kind font */    /* table cells */\n--fs-meta:13px; /* @kind font */\n--fs-body:14px; /* @kind font */\n--fs-body-md:14.5px; /* @kind font */\n--fs-ui:15px; /* @kind font */        /* card titles sm */\n--fs-h4:16px; /* @kind font */\n--fs-h3:18px; /* @kind font */\n--fs-h2:21px; /* @kind font */\n--fs-stat:25px; /* @kind font */      /* KPI value */\n--fs-h1:32px; /* @kind font */\n--fs-hero:48px; /* @kind font */\n--fs-display:64px; /* @kind font */\n\n/* --- weights --- */\n--fw-light:300; /* @kind font */--fw-regular:400; /* @kind font */--fw-medium:500; /* @kind font */--fw-semibold:600; /* @kind font */--fw-bold:700; /* @kind font */\n\n/* --- line heights --- */\n--lh-display:1.04; /* @kind font */--lh-h1:1.1; /* @kind font */--lh-h2:1.2; /* @kind font */--lh-flat:1; /* @kind font */\n--lh-body:1.55; /* @kind font */--lh-lead:1.6; /* @kind font */--lh-mono:1.7; /* @kind font */\n\n/* --- tracking --- */\n--track-display:-.03em; /* @kind font */--track-h1:-.02em; /* @kind font */--track-h2:-.015em; /* @kind font */--track-stat:-.02em; /* @kind font */\n--track-eyebrow:.18em; /* @kind font */--track-nav:.13em; /* @kind font */--track-badge:.12em; /* @kind font */\n\n/* --- measures --- */\n--measure-heading:24ch; /* @kind spacing */--measure-lead:56ch; /* @kind spacing */--measure-body:64ch; /* @kind spacing */\n\n/* --- composed roles --- */\n--type-display:var(--fw-medium) var(--fs-display)/var(--lh-display) var(--font-display); /* @kind font */\n--type-hero:var(--fw-medium) var(--fs-hero)/var(--lh-display) var(--font-display); /* @kind font */\n--type-h1:var(--fw-semibold) var(--fs-h1)/var(--lh-h1) var(--font-display); /* @kind font */\n--type-h2:var(--fw-medium) var(--fs-h2)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-h3:var(--fw-medium) var(--fs-h3)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-h4:var(--fw-medium) var(--fs-h4)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-card-title:var(--fw-medium) var(--fs-ui)/1.3 var(--font-display); /* @kind font */\n--type-stat:var(--fw-medium) var(--fs-stat)/var(--lh-flat) var(--font-display); /* @kind font */\n--type-lead:var(--fw-regular) var(--fs-body-md)/var(--lh-lead) var(--font-body); /* @kind font */\n--type-body:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body); /* @kind font */\n--type-eyebrow:var(--fw-medium) var(--fs-micro)/1.2 var(--font-mono); /* @kind font */\n--type-nav:var(--fw-medium) var(--fs-eyebrow)/1.2 var(--font-mono); /* @kind font */\n--type-data:var(--fw-regular) var(--fs-data)/var(--lh-mono) var(--font-mono); /* @kind font */\n--type-mono:var(--fw-regular) var(--fs-meta)/var(--lh-mono) var(--font-mono); /* @kind font */\n--type-badge:var(--fw-semibold) 9px/1 var(--font-mono); /* @kind font */\n--type-button:var(--fw-semibold) 13px/1 var(--font-display); /* @kind font */\n}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — spacing & layout. Balanced density: tighter than a marketing\n   page, looser than a raw terminal. Odd values are intentional; use the names. */\n:root{\n--space-1:4px; /* @kind spacing */--space-2:6px; /* @kind spacing */--space-3:9px; /* @kind spacing */--space-4:12px; /* @kind spacing */--space-5:14px; /* @kind spacing */--space-6:18px; /* @kind spacing */\n--space-7:22px; /* @kind spacing */--space-8:28px; /* @kind spacing */--space-9:34px; /* @kind spacing */--space-10:44px; /* @kind spacing */--space-11:56px; /* @kind spacing */--space-12:72px; /* @kind spacing */\n\n/* --- component padding --- */\n--pad-header-y:15px; /* @kind spacing */--pad-header-x:30px; /* @kind spacing */\n--pad-card:18px; /* @kind spacing */--pad-card-x:20px; /* @kind spacing */--pad-card-h:16px 20px; /* @kind spacing */\n--pad-cell:12px 20px; /* @kind spacing */\n--pad-button:11px 22px; /* @kind spacing */--pad-button-sm:7px 14px; /* @kind spacing */\n--pad-input:10px 14px; /* @kind spacing */\n--pad-page:24px 30px; /* @kind spacing */\n\n/* --- gaps --- */\n--gap-inline-xs:6px; /* @kind spacing */--gap-inline:9px; /* @kind spacing */--gap-stack:12px; /* @kind spacing */--gap-card:14px; /* @kind spacing */--gap-grid:20px; /* @kind spacing */\n--gap-nav:24px; /* @kind spacing */--gap-col:32px; /* @kind spacing */--gap-section:44px; /* @kind spacing */\n\n/* --- controls --- */\n--control-h:40px; /* @kind spacing */--control-h-sm:32px; /* @kind spacing */--control-h-lg:46px; /* @kind spacing */--tap-min:44px; /* @kind spacing */\n--mark-size:28px; /* @kind spacing */--mark-size-lg:42px; /* @kind spacing */--coin-size:20px; /* @kind spacing */\n\n/* --- layout --- */\n--sidebar-w:340px; /* @kind spacing */--page-max:1440px; /* @kind spacing */--auth-max:400px; /* @kind spacing */--prose-max:720px; /* @kind spacing */\n--grid-console:minmax(0,1fr) 340px; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — radii, borders, shadows, motion. */\n:root{\n/* --- radii: sober; nothing pill-shaped except status dots --- */\n--radius-xs:4px;   /* tabs, badges, table chips */\n--radius-sm:6px;   /* buttons, inputs */\n--radius-md:8px;   /* cards, panels — the default */\n--radius-lg:12px;  /* modals, hero plates */\n--radius-circle:50%;\n\n/* --- rules --- */\n--rule-h:2px; /* @kind spacing */--rule-h-lg:3px; /* @kind spacing */\n--hairline:1px solid var(--border-hairline); /* @kind other */\n--hairline-card:1px solid var(--border-card); /* @kind other */\n\n/* --- shadows: sparse; ink barely casts. The only glow belongs to LIVE + the mark --- */\n--shadow-card:0 2px 12px rgba(0,0,0,.35);\n--shadow-modal:0 16px 48px rgba(0,0,0,.55);\n--shadow-live:0 0 8px rgba(245,184,79,.7);\n--shadow-mark:0 0 22px rgba(245,184,79,.14);\n--shadow-none:none; /* @kind shadow */\n\n/* --- focus --- */\n--focus-ring:2px solid var(--violet-400); /* @kind other */\n\n/* --- motion: short, linear-ish, no bounce; nothing moves for decoration --- */\n--dur-fast:120ms; /* @kind other */--dur:180ms; /* @kind other */--dur-slow:280ms; /* @kind other */\n--ease:cubic-bezier(.2,.6,.2,1); /* @kind other */\n--ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n--transition-color:color var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — element defaults. Deliberately thin. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);text-wrap:pretty;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{margin:0;color:var(--text-heading);font-family:var(--font-display);text-wrap:balance}\nh1{font:var(--type-h1);letter-spacing:var(--track-h1)}\nh2{font:var(--type-h2);letter-spacing:var(--track-h2)}\nh3{font:var(--type-h3)}\nh4{font:var(--type-h4)}\np{margin:0}\na{color:var(--link);text-decoration:none;transition:var(--transition-color)}\na:hover{color:var(--link-hover)}\nsmall{font-size:var(--fs-caption)}\ncode,kbd,samp{font-family:var(--font-mono)}\nimg{display:block;max-width:100%}\nbutton{font:inherit}\ntable{border-collapse:collapse}\n::selection{background:rgba(161,138,255,.35);color:var(--lilac-100)}\n:focus-visible{outline:var(--focus-ring);outline-offset:2px}\n/* Gradient headline treatment — one clause per page, never a whole heading. */\n.csx-grad{font-style:normal;color:var(--gold-400);background:var(--gradient-text);-webkit-background-clip:text;background-clip:text}\n@supports ((-webkit-background-clip:text) or (background-clip:text)){.csx-grad{color:transparent}}\n/* The gradient rule — brand/content separator, page top or section break. */\n.csx-rule{height:var(--rule-h);background:var(--gradient-rule)}\n<\u002Fstyle>\n  <style>/* CryptoSmith X — webfonts (inherited from BlynAI).\n   Space Grotesk (display), IBM Plex Sans (body), IBM Plex Mono (labels & data).\n\n   Deviation from the shipped design system, sanctioned by its readme\n   (\"if the company self-hosts woff2 files, send them and this becomes real\n   @font-face rules\"): the files are served from /fonts instead of the Google\n   Fonts CDN. An EU company page should not hand every visitor's IP to a third\n   party for three typefaces, and the page keeps working without the CDN.\n   Subsets: latin + latin-ext only — latin-ext is what carries ė į ų š ž č ū.\n   Space Grotesk is the variable file (300-700); Plex ships static instances.\n\n   Sources: fonts.google.com — Space Grotesk (OFL), IBM Plex Sans/Mono (OFL).\n   Refresh: node tools/fetch-fonts.mjs (see README). */\n/* IBM Plex Mono 400 · latin-ext */\n@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;\n  src:url(\"33cfcd0d-70bb-4f4f-8e6f-e6b73f087d26\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* IBM Plex Mono 400 · latin */\n@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;\n  src:url(\"191b9762-5477-473b-a917-5f970fd0e051\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n/* IBM Plex Mono 500 · latin-ext */\n@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-d nt-display:swap;\n  src:url(\"c6dde251-bd2a-44c0-a0b7-253fa829ec41\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* IBM Plex Sans 500 · latin */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;\n  src:url(\"93c16b72-ceae-4638-84b2-e353bc6b8fa7\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n/* IBM Plex Sans 600 · latin-ext */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;\n  src:url(\"0e0b4730-5453-44e3-9e60-59e5a06adda1\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* IBM Plex Sans 600 · latin */\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;\n  src:url(\"92bb5a39-60a9-47d4-9598-2ee08ad282c7\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n/* Space Grotesk 300 700 · latin-ext */\n@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;\n  src:url(\"b088af59-9066-4368-94f9-058c7c732d9b\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n/* Space Grotesk 300 700 · latin */\n@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;\n  src:url(\"ac337ec9-851e-4481-8117-3767e38e3bd4\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n\n/* CryptoSmith X — colour system. Dark-only (\"forge\") theme.\n   Two brand axes inherited from BlynAI: VIOLET (AI / action) leads on ink,\n   GOLD (signal / brand) is reserved for the mark, live states and key numbers.\n   Market colours (green/red) exist ONLY for PnL and direction — never decorative. */\n:root{\n/* --- base: violet axis --- */\n--violet-100:#EFEAF7;--violet-200:#DCD3F5;--violet-300:#BDB2D6;--violet-400:#A18AFF;--violet-500:#8C6BC9;--violet-600:#8360C4;--violet-700:#6B4EDB;--violet-800:#5B3FC4;\n/* --- base: gold axis (brand signal) --- */\n--gold-200:#F7E6C1;--gold-300:#FFD987;--gold-400:#F5B84F;--gold-600:#C8963B;--gold-700:#B97F2E;\n/* --- base: ink (violet-tinted blacks) --- */\n--ink-950:#050408;--ink-900:#07060B;--ink-850:#0A0812;--ink-800:#0D0B14;--ink-700:#12101C;--ink-600:#1A1726;\n/* --- base: neutral text on violet ink --- */\n--lilac-100:#EFEAF7;--lilac-200:#DCD3F5;--lilac-300:#BDB2D6;--lilac-500:#7C7391;--lilac-700:#4A4358;\n--sand-200:#C8BBA6; /* warm mono data, the one warm neutral */\n/* --- base: market direction --- */\n--up-300:#7FE0B5;--up-500:#41C98F;--up-700:#2E9A6C;\n--down-300:#FF8A97;--down-500:#EF5D6F;--down-700:#C23D4E;\n\n/* --- semantic: surfaces --- */\n--surface-page:var(--ink-900);\n--surface-card:var(--ink-800);\n--surface-raised:var(--ink-700);\n--surface-sunken:var(--ink-950);\n--surface-overlay:rgba(5,4,8,.78);\n--surface-glass:rgba(161,138,255,.06);\n--surface-plate:var(--ink-850); /* logo plate, coin */\n/* --- semantic: text --- */\n--text-heading:var(--lilac-100);\n--text-body:var(--lilac-300);\n--text-muted:var(--lilac-500);\n--text-faint:var(--lilac-700);\n--text-data:var(--sand-200);\n--text-on-action:#FFFFFF;\n--text-on-gold:var(--ink-900);\n/* --- semantic: accents & actions --- */\n--accent:var(--violet-400);\n--accent-strong:var(--violet-700);\n--accent-gold:var(--gold-400);\n--action-primary:var(--violet-700);\n--action-primary-hover:var(--violet-800);\n--live:var(--gold-400);\n--eyebrow:var(--lilac-500);\n/* --- semantic: links --- */\n--link:var(--violet-400);\n--link-hover:var(--violet-200);\n/* --- semantic: borders --- */\n--border-hairline:rgba(161,138,255,.11);\n--border-card:rgba(161,138,255,.13);\n--border-strong:rgba(161,138,255,.28);\n--border-input:rgba(161,138,255,.22);\n--border-gold:rgba(245,184,79,.3);\n/* --- semantic: market --- */\n--pnl-up:var(--up-500);\n--pnl-down:var(--down-500);\n--long:var(--up-500);\n--short:var(--down-500);\n--tint-up:rgba(65,201,143,.11);\n--tint-down:rgba(239,93,111,.11);\n/* --- semantic: tints (badge/tag fills) --- */\n--tint-violet:rgba(161,138,255,.13);\n--tint-gold:rgba(245,184,79,.11);\n--tint-neutral:rgba(124,115,145,.15);\n/* --- semantic: status --- */\n--status-ok:var(--up-500);\n--status-warn:var(--gold-400);\n--status-error:var(--down-500);\n--status-off:var(--lilac-700);\n\n/* --- gradients: the brand's one recurring device, gold meets violet --- */\n--gradient-rule:linear-gradient(90deg,#F5B84F,#C98F63 42%,#8C6BC9 74%,#6B4EDB); /* @kind color */\n--gradient-text:linear-gradient(96deg,#F5B84F,#A18AFF); /* @kind color */\n--gradient-curve:linear-gradient(to right,#F5B84F,#C98F63 55%,#6B4EDB); /* @kind color */\n--gradient-divider-v:linear-gradient(180deg,rgba(245,184,79,.5),rgba(107,78,219,.45)); /* @kind color */\n/* --- washes: soft field light, gold NW / violet SE, always faint --- */\n--wash-gold:radial-gradient(820px 520px at 2% 0%,rgba(245,184,79,.10),transparent 66%); /* @kind color */\n--wash-violet:radial-gradient(820px 620px at 100% 100%,rgba(107,78,219,.22),transparent 70%); /* @kind color */\n}\n\n/* CryptoSmith X — typography.\n   Three faces, three jobs: Space Grotesk = display, headings, buttons, nav.\n   IBM Plex Sans = running prose. IBM Plex Mono = every eyebrow, label and number. */\n:root{\n--font-display:\"Space Grotesk\",\"Helvetica Neue\",Arial,sans-serif;\n--font-body:\"IBM Plex Sans\",system-ui,-apple-system,sans-serif;\n--font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n\n/* --- size scale --- */\n--fs-micro:10px; /* @kind font */     /* mono eyebrow, badges */\n--fs-eyebrow:11px; /* @kind font */   /* mono eyebrow, nav */\n--fs-caption:12px; /* @kind font */\n--fs-data:12.5px; /* @kind font */    /* table cells */\n--fs-meta:13px; /* @kind font */\n--fs-body:14px; /* @kind font */\n--fs-body-md:14.5px; /* @kind font */\n--fs-ui:15px; /* @kind font */        /* card titles sm */\n--fs-h4:16px; /* @kind font */\n--fs-h3:18px; /* @kind font */\n--fs-h2:21px; /* @kind font */\n--fs-stat:25px; /* @kind font */      /* KPI value */\n--fs-h1:32px; /* @kind font */\n--fs-hero:48px; /* @kind font */\n--fs-display:64px; /* @kind font */\n\n/* --- weights --- */\n--fw-light:300; /* @kind font */--fw-regular:400; /* @kind font */--fw-medium:500; /* @kind font */--fw-semibold:600; /* @kind font */--fw-bold:700; /* @kind font */\n\n/* --- line heights --- */\n--lh-display:1.04; /* @kind font */--lh-h1:1.1; /* @kind font */--lh-h2:1.2; /* @kind font */--lh-flat:1; /* @kind font */\n--lh-body:1.55; /* @kind font */--lh-lead:1.6; /* @kind font */--lh-mono:1.7; /* @kind font */\n\n/* --- tracking --- */\n--track-display:-.03em; /* @kind font */--track-h1:-.02em; /* @kind font */--track-h2:-.015em; /* @kind font */--track-stat:-.02em; /* @kind font */\n--track-eyebrow:.18em; /* @kind font */--track-nav:.13em; /* @kind font */--track-badge:.12em; /* @kind font */\n\n/* --- measures --- */\n--measure-heading:24ch; /* @kind spacing */--measure-lead:56ch; /* @kind spacing */--measure-body:64ch; /* @kind spacing */\n\n/* --- composed roles --- */\n--type-display:var(--fw-medium) var(--fs-display)/var(--lh-display) var(--font-display); /* @kind font */\n--type-hero:var(--fw-medium) var(--fs-hero)/var(--lh-display) var(--font-display); /* @kind font */\n--type-h1:var(--fw-semibold) var(--fs-h1)/var(--lh-h1) var(--font-display); /* @kind font */\n--type-h2:var(--fw-medium) var(--fs-h2)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-h3:var(--fw-medium) var(--fs-h3)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-h4:var(--fw-medium) var(--fs-h4)/var(--lh-h2) var(--font-display); /* @kind font */\n--type-card-title:var(--fw-medium) var(--fs-ui)/1.3 var(--font-display); /* @kind font */\n--type-stat:var(--fw-medium) var(--fs-stat)/var(--lh-flat) var(--font-display); /* @kind font */\n--type-lead:var(--fw-regular) var(--fs-body-md)/var(--lh-lead) var(--font-body); /* @kind font */\n--type-body:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body); /* @kind font */\n--type-eyebrow:var(--fw-medium) var(--fs-micro)/1.2 var(--font-mono); /* @kind font */\n--type-nav:var(--fw-medium) var(--fs-eyebrow)/1.2 var(--font-mono); /* @kind font */\n--type-data:var(--fw-regular) var(--fs-data)/var(--lh-mono) var(--font-mono); /* @kind font */\n--type-mono:var(--fw-regular) var(--fs-meta)/var(--lh-mono) var(--font-mono); /* @kind font */\n--type-badge:var(--fw-semibold) 9px/1 var(--font-mono); /* @kind font */\n--type-button:var(--fw-semibold) 13px/1 var(--font-display); /* @kind font */\n}\n\n/* CryptoSmith X — spacing & layout. Balanced density: tighter than a marketing\n   page, looser than a raw terminal. Odd values are intentional; use the names. */\n:root{\n--space-1:4px; /* @kind spacing */--space-2:6px; /* @kind spacing */--space-3:9px; /* @kind spacing */--space-4:12px; /* @kind spacing */--space-5:14px; /* @kind spacing */--space-6:18px; /* @kind spacing */\n--space-7:22px; /* @kind spacing */--space-8:28px; /* @kind spacing */--space-9:34px; /* @kind spacing */--space-10:44px; /* @kind spacing */--space-11:56px; /* @kind spacing */--space-12:72px; /* @kind spacing */\n\n/* --- component padding --- */\n--pad-header-y:15px; /* @kind spacing */--pad-header-x:30px; /* @kind spacing */\n--pad-card:18px; /* @kind spacing */--pad-card-x:20px; /* @kind spacing */--pad-card-h:16px 20px; /* @kind spacing */\n--pad-cell:12px 20px; /* @kind spacing */\n--pad-button:11px 22px; /* @kind spacing */--pad-button-sm:7px 14px; /* @kind spacing */\n--pad-input:10px 14px; /* @kind spacing */\n--pad-page:24px 30px; /* @kind spacing */\n\n/* --- gaps --- */\n--gap-inline-xs:6px; /* @kind spacing */--gap-inline:9px; /* @kind spacing */--gap-stack:12px; /* @kind spacing */--gap-card:14px; /* @kind spacing */--gap-grid:20px; /* @kind spacing */\n--gap-nav:24px; /* @kind spacing */--gap-col:32px; /* @kind spacing */--gap-section:44px; /* @kind spacing */\n\n/* --- controls --- */\n--control-h:40px; /* @kind spacing */--control-h-sm:32px; /* @kind spacing */--control-h-lg:46px; /* @kind spacing */--tap-min:44px; /* @kind spacing */\n--mark-size:28px; /* @kind spacing */--mark-size-lg:42px; /* @kind spacing */--coin-size:20px; /* @kind spacing */\n\n/* --- layout --- */\n--sidebar-w:340px; /* @kind spacing */--page-max:1440px; /* @kind spacing */--auth-max:400px; /* @kind spacing */--prose-max:720px; /* @kind spacing */\n--grid-console:minmax(0,1fr) 340px; /* @kind other */\n}\n\n/* CryptoSmith X — radii, borders, shadows, motion. */\n:root{\n/* --- radii: sober; nothing pill-shaped except status dots --- */\n--radius-xs:4px;   /* tabs, badges, table chips */\n--radius-sm:6px;   /* buttons, inputs */\n--radius-md:8px;   /* cards, panels — the default */\n--radius-lg:12px;  /* modals, hero plates */\n--radius-circle:50%;\n\n/* --- rules --- */\n--rule-h:2px; /* @kind spacing */--rule-h-lg:3px; /* @kind spacing */\n--hairline:1px solid var(--border-hairline); /* @kind other */\n--hairline-card:1px solid var(--border-card); /* @kind other */\n\n/* --- shadows: sparse; ink barely casts. The only glow belongs to LIVE + the mark --- */\n--shadow-card:0 2px 12px rgba(0,0,0,.35);\n--shadow-modal:0 16px 48px rgba(0,0,0,.55);\n--shadow-live:0 0 8px rgba(245,184,79,.7);\n--shadow-mark:0 0 22px rgba(245,184,79,.14);\n--shadow-none:none; /* @kind shadow */\n\n/* --- focus --- */\n--focus-ring:2px solid var(--violet-400); /* @kind other */\n\n/* --- motion: short, linear-ish, no bounce; nothing moves for decoration --- */\n--dur-fast:120ms; /* @kind other */--dur:180ms; /* @kind other */--dur-slow:280ms; /* @kind other */\n--ease:cubic-bezier(.2,.6,.2,1); /* @kind other */\n--ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n--transition-color:color var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); /* @kind other */\n}\n\n/* CryptoSmith X — element defaults. Deliberately thin. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);text-wrap:pretty;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{margin:0;color:var(--text-heading);font-family:var(--font-display);text-wrap:balance}\nh1{font:var(--type-h1);letter-spacing:var(--track-h1)}\nh2{font:var(--type-h2);letter-spacing:var(--track-h2)}\nh3{font:var(--type-h3)}\nh4{font:var(--type-h4)}\np{margin:0}\na{color:var(--link);text-decoration:none;transition:var(--transition-color)}\na:hover{color:var(--link-hover)}\nsmall{font-size:var(--fs-caption)}\ncode,kbd,samp{font-family:var(--font-mono)}\nimg{display:block;max-width:100%}\nbutton{font:inherit}\ntable{border-collapse:collapse}\n::selection{background:rgba(161,138,255,.35);color:var(--lilac-100)}\n:focus-visible{outline:var(--focus-ring);outline-offset:2px}\n/* Gradient headline treatment — one clause per page, never a whole heading. */\n.csx-grad{font-style:normal;color:var(--gold-400);background:var(--gradient-text);-webkit-background-clip:text;background-clip:text}\n@supports ((-webkit-background-clip:text) or (background-clip:text)){.csx-grad{color:transpa imitu.', r: 'w', c: 'ls', d: ['XRP', 'LTC', 'BCH', 'XLM', 'TRX', 'XDG'], l: ['XRP', 'LTC', 'BCH', 'XLM', 'TRX', 'XDG'] }),\n          mk({ k: 'CorrelationRisk.Groups.BTC_BETA / ETH_BETA', t: 'BTC ir ETH grupės', de: 'Po vieną porą kiekvienoje — grupės limitas joms niekada nesuveikia.', r: 'w', c: 'ls', d: ['XBT', 'ETH'], l: ['XBT', 'ETH'] })\n        ])\n      ]},\n      { groups: [\n        G('Darbiniai lygiai (TpSl)', [\n          mk({ k: 'TpSl.StopLossPercent', t: 'Darbinis stop-loss', de: 'Veikia trijose vietose iš karto: pozicijos stop, atstumo grindys saizeryje (= apimtis), biržos avarinis stop ×2.', r: 'd', c: 'num', d: 2, l: 2, u: '%', lk: 'patvirt. + peržiūra' }),\n          mk({ k: 'TpSl.TakeProfitPercent', t: 'Pelno perdavimo trail\\u0027ui taškas', de: 'Ne išėjimas: nuima biržos TP/SL ir apginkluoja trailing-stop. Pagrindinis instancijų skirtumas.', r: 'd', c: 'num', d: 6, l: 4, u: '%', lk: 'patvirtinimas', eff: 'keitimas laužo eksperimento/kontrolės palyginimą', ew: 1 }),\n          mk({ k: 'TpSl.TrailingStopPercent', t: 'Trailing-stop atstumas', de: 'Antras ir paskutinis instancijų skirtumas; keisti tik kartu su sprendimu dėl eksperimento.', r: 'd', c: 'num', d: 0.5, l: 0.75, u: '%', lk: 'patvirtinimas' }),\n          mk({ k: 'TpSl.ExchangeProtectionMultiplierPercent', t: 'Biržos apsaugos atstumas', de: 'Kiek toliau darbinių lygių stovi reduce-only biržos orderiai.', r: 'd', c: 'num', d: 200, l: 200, u: '%', lk: 'patvirtinimas', eff: '≈100 — birža pradės uždarinėti anksčiau boto ir atims trail', ew: 1 }),\n          mk({ k: 'TpSl.ExternalTrailingActivationProgressPercent', t: 'Trail svetimoms pozicijoms', de: 'Tik KRAKEN_SYNC pozicijoms; 0 sąžiningai išjungia.', r: 'w', c: 'sl', d: 80, l: 80, u: '%', mn: 0, mx: 100, st: 5 })\n        ]),\n        G('Stop nuo volatilumo (Exits)', [\n          mk({ k: 'Exits.StopAtrMult', t: 'ATR daugiklis stop\\u0027ui', de: 'Platesnis stop — mažesnė apimtis (apimtis = rizika / stop); per platus atsirems į lubas ir užbl
