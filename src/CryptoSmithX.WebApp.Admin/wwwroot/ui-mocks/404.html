<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — CryptoSmith X</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ds/styles.css">
<link rel="stylesheet" href="/ui-mocks/assets/site.css">
<style>
  /* site.css lays the body out for the two-column shell; here there is one card and
     it should sit in the middle rather than stretch to the viewport. */
  body{min-height:100dvh; display:grid; place-items:center; padding:24px}
  .nf{
    width:min(560px,100%); padding:56px 44px; text-align:center;
    background:var(--wash-gold),var(--wash-violet),var(--surface-page);
    border:1px solid var(--border-card); border-radius:var(--radius-lg); overflow:hidden;
  }
  .nf img{width:44px; height:44px; margin:0 auto 18px}
  .nf .code{font:600 10px/1 var(--font-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--eyebrow)}
  .nf h1{max-width:none; margin:14px 0 0}
  .nf p{margin:14px 0 0; color:var(--text-muted)}
  .nf a{display:inline-block; margin-top:26px; border-bottom:1px solid rgba(161,138,255,.3)}
</style>
</head>
<body>
  <main class="nf">
    <img src="/ds/assets/cryptosmith-mark.svg" width="44" height="44" alt="">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>There is no such page, or it has moved.</p>
    <a href="/">Back to the start</a>
  </main>
</body>
</html>
