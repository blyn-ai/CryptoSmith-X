<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--surface-page);display:flex;flex-direction:column;gap:12px}
u{text-decoration:none;font:500 10px var(--font-mono);color:var(--text-muted)}

<div class="pair"><div class="csx-rule" style="flex:1"></div><u>--gradient-rule</u></div>
<div class="pair"><span class="csx-grad" style="font:var(--type-h2)">One gradient clause per page</span><u>.csx-grad / --gradient-text</u></div>
<div class="pair"><div style="flex:1;height:60px;border-radius:var(--radius-md);border:1px solid var(--border-card);background:var(--wash-gold),var(--wash-violet),var(--surface-card)"></div><u>--wash-gold + --wash-violet</u></div>
