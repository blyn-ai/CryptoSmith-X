document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: a saturated\n   fill is not legible as 9 px type. */\n:root{\n/* ── surfaces (Paper) ── */\n--surface-page:#F3F1EB;--surface-card:#FAF9F5;--surface-band:#FAF9F5;--surface-sunken:#EDEAE2;\n--surface-overlay:rgba(21,21,20,.42);\n\n/* ── text ── */\n--text-heading:#151514;--text-body:#3A3833;--text-muted:#5E5B55;--text-faint:#74716B;\n--text-data:#151514;--text-zero:#5E5B55;--text-unmeasured:#74716B;--eyebrow:#66635B;\n--text-on-action:#FAF9F5;\n\n/* ── brand: fill rung and text rung ── */\n--brand:#BE0069;--brand-deep:#A3006F;--brand-text:#BE0069;\n--accent:#BE0069;--action-primary:#BE0069;--action-primary-hover:#151514;\n--link:#BE0069;--link-hover:#151514;\n\n/* ── money: green = profit, red = loss, nothing else ── */\n--money-up:#2E7D0E;--money-down:#B3323C;--money-up-ink:#2E7D0E;--money-down-ink:#A32B35;\n--money-flat:#5E5B55;--band-up:#2E7D0E;--band-down:#A32B35;\n--tint-up:rgba(46,125,14,.09);--tint-down:rgba(163,43,53,.08);\n--border-up:#2E7D0E;--border-down:#A32B35;\n\n/* ── operation: direction, never a result ── */\n--long:#0B5FA5;--short:#A94A12;\n\n/* ── bot state ── */\n--state-running:#BE0069;--state-stale:#7E5B0E;--state-blackout:#7E5B0E;\n--state-stopped:#9A968E;--state-hold-ink:#7E5B0E;\n--tint-hold:rgba(126,91,14,.10);--border-hold:#7E5B0E;\n\n/* ── borders. A border means STATE or CONTROL; categorical labels wear none. ── */\n--border-hairline:#DAD6CC;--border-card:#CAC6BC;--border-strong:#BE0069;--border-input:#BDB8AD;\n--chip-border:transparent;\n--tint-neutral:rgba(21,21,20,.05);--tint-brand:rgba(190,0,105,.07);\n\n/* ── the sheet: a 4 px raster under the card, never through a panel ── */\n--dot-pattern:radial-gradient(rgba(21,21,20,.075) 1px,transparent 1px); /* @kind color */\n--dot-size:4px; /* @kind spacing */\n}\n\n[data-theme=\"night\"]{\n--surface-page:#0D0D0C;--surface-card:#131311;--surface-raised:#191816;--surface-band:#131311;\n--surface-sunken:#0A0A09;--surface-overlay:rgba(0,0,0,.6);\n\n--text-heading:#F1EEE8;--text-body:#D6D2CA;--text-muted:#A29E96;--text-faint:#8C887F;\n--text-data:#F1EEE8;--text-zero:#A29E96;--text-unmeasured:#8C887F;--eyebrow:#A29E96;\n--text-on-action:#0D0D0C;\n\n--brand:#E00087;--brand-deep:#A3006F;--brand-text:#FF3D9E;\n--accent:#FF3D9E;--action-primary:#E00087;--action-primary-hover:#F1EEE8;\n--link:#FF3D9E;--link-hover:#F1EEE8;\n\n--money-up:#8BD450;--money-down:#F05B68;--money-up-ink:#8BD450;--money-down-ink:#F05B68;\n--money-flat:#A29E96;--band-up:#8BD450;--band-down:#F05B68;\n--tint-up:rgba(139,212,80,.10);--tint-down:rgba(240,91,104,.10);\n--border-up:#8BD450;--border-down:#F05B68;\n\n--long:#58BCE8;--short:#FF8A5B;\n\n--state-running:#E00087;--state-stale:#D8A843;--state-blackout:#D8A843;\n--state-stopped:#3A3833;--state-hold-ink:#D8A843;\n--tint-hold:rgba(216,168,67,.11);--border-hold:#D8A843;\n\n--border-hairline:#2A2823;--border-card:#35322D;--border-strong:#E00087;--border-input:#45413A;\n--chip-border:transparent;\n--tint-neutral:rgba(241,238,232,.05);--tint-brand:rgba(224,0,135,.10);\n\n--dot-pattern:radial-gradient(rgba(241,238,232,.06) 1px,transparent 1px); /* @kind color */\n--dot-size:4px; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* CSX Bot — type. Three faces, three jobs:\n   Anton = display (wordmark, panel titles, the statement line) — condensed caps.\n   Space Grotesk = the little running prose the product allows.\n   DM Mono = every number, label, state word and categorical value. Tabular, always. */\n:root{\n--font-display:'Anton','Arial Narrow','Helvetica Neue',sans-serif;\n--font-body:'Space Grotesk','Helvetica Neue',Arial,sans-serif;\n--font-mono:'DM Mono',ui-monospace,Menlo,monospace;\n--font-heading:var(--font-display);\n\n/* ── sizes ── */\n--fs-micro:10px; /* @kind font */--fs-eyebrow:11px; /* @kind font */--fs-caption:12px; /* @kind font */\n--fs-data:12px; /* @kind font */--fs-meta:13px; /* @kind font */--fs-body:14px; /* @kind font */\n--fs-ui:14px; /* @kind font */--fs-h3:18px; /* @kind font */--fs-h2:21px; /* @kind font */\n--fs- pacing */--gap-inline-xs:6px; /* @kind spacing */\n\n/* ── controls ── */\n--control-h:34px; /* @kind spacing */--control-h-sm:26px; /* @kind spacing */--tap-min:44px; /* @kind spacing */\n--pad-button:0 14px; /* @kind spacing */--pad-button-sm:0 10px; /* @kind spacing */\n--pad-input:8px 10px; /* @kind spacing */\n--dot:7px; /* @kind spacing */--dot-lg:9px; /* @kind spacing */--mark-size:13px; /* @kind spacing */\n\n/* ── layout ── */\n--card-max:1040px; /* @kind spacing */\n--band-w:3px; /* @kind spacing */\n--curve-h:104px; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* CSX Bot — radii, borders, shadows, motion.\n   Zero radius everywhere; no shadow, no glow, no glass, no gradient. The colour should\n   look printed by a terminal, not lit. */\n:root{\n--radius-xs:0px;--radius-sm:0px;--radius-md:0px;--radius-lg:0px;--radius-circle:50%;\n--radius-panel:0px;--radius-control:0px;\n\n--hairline:1px solid var(--border-hairline); /* @kind other */\n--panel-border:1px solid var(--border-card); /* @kind other */\n--rule-h:2px; /* @kind spacing */\n\n--shadow-none:none; /* @kind shadow */--shadow-panel:none; /* @kind shadow */--shadow-modal:none; /* @kind shadow */\n\n--focus-ring:2px solid var(--brand); /* @kind other */\n\n/* ── motion: colour transitions only; nothing moves for decoration ── */\n--dur-fast:120ms; /* @kind other */--dur:180ms; /* @kind other */--dur-slow:280ms; /* @kind other */\n--ease:linear; /* @kind other */\n--transition-color:color var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); /* @kind other */\n}\n<\u002Fstyle>\n<style>/* CSX Bot — element defaults. Thin on purpose. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);\n  font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);\n  text-wrap:pretty;-webkit-font-smoothing:antialiased}\nh1,h2,h3{margin:0;co =\"night\"]. Both are the same token\n   set at different luminance — a theme flip changes brightness, never identity.\n\n   Colour means exactly one thing each, and it stays rare:\n\n     brand (magenta)  CryptoSmith / system / active state\n     green            positive P&L        ONLY\n     red              negative P&L        ONLY\n     blue             LONG / BUY    \\ the operation layer: the product's only two\n     coral            SHORT / SELL  /  operation colours, kept OUT of the money palette\n     amber            warning / risk / entries paused\n     neutral          data — the vast majority of every screen\n\n   Every text role clears 4.5:1 against the surface it sits on. Where a hue is used as a\n   FILL and as TEXT, the two are separate rungs (--brand vs --brand-text): a saturated\n   fill is not legible as 9 px type. */\n:root{\n/* ── surfaces (Paper) ── */\n--surface-page:#F3F1EB;--surface-card:#FAF9F5;--surface-band:#FAF9F5;--surface-sunken:#EDEAE2;\n--surface-overlay:rgba(21,21,20,.42);\n\n/* ── text ── */\n--text-heading:#151514;--text-body:#3A3833;--text-muted:#5E5B55;--text-faint:#74716B;\n--text-data:#151514;--text-zero:#5E5B55;--text-unmeasured:#74716B;--eyebrow:#66635B;\n--text-on-action:#FAF9F5;\n\n/* ── brand: fill rung and text rung ── */\n--brand:#BE0069;--brand-deep:#A3006F;--brand-text:#BE0069;\n--accent:#BE0069;--action-primary:#BE0069;--action-primary-hover:#151514;\n--link:#BE0069;--link-hover:#151514;\n\n/* ── money: green = profit, red = loss, nothing else ── */\n--money-up:#2E7D0E;--money-down:#B3323C;--money-up-ink:#2E7D0E;--money-down-ink:#A32B35;\n--money-flat:#5E5B55;--band-up:#2E7D0E;--band-down:#A32B35;\n--tint-up:rgba(46,125,14,.09);--tint-down:rgba(163,43,53,.08);\n--border-up:#2E7D0E;--border-down:#A32B35;\n\n/* ── operation: direction, never a result ── */\n--long:#0B5FA5;--short:#A94A12;\n\n/* ── bot state ── */\n--state-running:#BE0069;--state-stale:#7E5B0E;--state-blackout:#7E5B0E;\n--state-stopped:#9A968E;--state-hold-ink:#7E5B0E;\n--tint-hold:rgba(126,91,14,.10);--border-hold:#7E5B0E;\n\n/* ── borders. A border means STATE or CONTROL; categorical labels wear none. ── */\n--border-hairline:#DAD6CC;--border-card:#CAC6BC;--border-strong:#BE0069;--border-input:#BDB8AD;\n--chip-border:transparent;\n--tint-neutral:rgba(21,21,20,.05);--tint-brand:rgba(190,0,105,.07);\n\n/* ── the sheet: a 4 px raster under the card, never through a panel ── */\n--dot-pattern:radial-gradient(rgba(21,21,20,.075) 1px,transparent 1px); /* @kind color */\n--dot-size:4px; /* @kind spacing */\n}\n\n[data-theme=\"night\"]{\n--surface-page:#0D0D0C;--surface-card:#131311;--surface-raised:#191816;--surface-band:#131311;\n--surface-sunken:#0A0A09;--surface-overlay:rgba(0,0,0,.6);\n\n--text-heading:#F1EEE8;--text-body:#D6D2CA;--text-muted:#A29E96;--text-faint:#8C887F;\n--text-data:#F1EEE8;--text-zero:#A29E96;--text-unmeasured:#8C887F;--eyebrow:#A29E96;\n--text-on-action:#0D0D0C;\n\n--brand:#E00087;--brand-deep:#A3006F;--brand-text:#FF3D9E;\n--accent:#FF3D9E;--action-primary:#E00087;--action-primary-hover:#F1EEE8;\n--link:#FF3D9E;--link-hover:#F1EEE8;\n\n--money-up:#8BD450;--money-down:#F05B68;--money-up-ink:#8BD450;--money-down-ink:#F05B68;\n--money-flat:#A29E96;--band-up:#8BD450;--band-down:#F05B68;\n--tint-up:rgba(139,212,80,.10);--tint-down:rgba(240,91,104,.10);\n--border-up:#8BD450;--border-down:#F05B68;\n\n--long:#58BCE8;--short:#FF8A5B;\n\n--state-running:#E00087;--state-stale:#D8A843;--state-blackout:#D8A843;\n--state-stopped:#3A3833;--state-hold-ink:#D8A843;\n--tint-hold:rgba(216,168,67,.11);--border-hold:#D8A843;\n\n--border-hairline:#2A2823;--border-card:#35322D;--border-strong:#E00087;--border-input:#45413A;\n--chip-border:transparent;\n--tint-neutral:rgba(241,238,232,.05);--tint-brand:rgba(224,0,135,.10);\n\n--dot-pattern:radial-gradient(rgba(241,238,232,.06) 1px,transparent 1px); /* @kind color */\n--dot-size:4px; /* @kind spacing */\n}\n\n/* CSX Bot — type. Three faces, three jobs:\n   Anton = display (wordmark, panel titles, the statement line) — condensed caps.\n   Space Grotesk = the little running prose the product allows.\n   DM Mono = every number, label, state word and categorical value. Tabular, always. */\n:root{\n--font-display:'Anton','Arial Narrow','Helvetica Neue',sans-serif;\n--font-body:'Space Grotesk','Helvetica Neue',Arial,sans-serif;\n--font-mono:'DM Mono',ui-monospace,Menlo,monospace;\n--font-heading:var(--font-display);\n\n/* ── sizes ── */\n--fs-micro:10px; /* @kind font */--fs-eyebrow:11px; /* @kind font */--fs-caption:12px; /* @kind font */\n--fs-data:12px; /* @kind font */--fs-meta:13px; /* @kind font */--fs-body:14px; /* @kind font */\n--fs-ui:14px; /* @kind font */--fs-h3:18px; /* @kind font */--fs-h2:21px; /* @kind font */\n--fs-stat:20px; /* @kind font */--fs-h1:32px; /* @kind font */--fs-money:76px; /* @kind font */\n\n/* ── weights ── */\n--fw-light:300; /* @kind font */--fw-regular:400; /* @kind font */--fw-medium:500; /* @kind font */\n--fw-semibold:600; /* @kind font */--fw-bold:700; /* @kind font */\n\n/* ── line heights ── */\n--lh-flat:1; /* @kind font */--lh-h1:1.1; /* @kind font */--lh-h2:1.2; /* @kind font */\n--lh-body:1.55; /* @kind font */--lh-mono:1.7; /* @kind font */\n\n/* ── tracking. Categorical labels sit at .17em: that spacing is what makes an unframed\n      label read as a label rather than as stray text. ── */\n--track-h1:.005em; /* @kind font */--track-h2:.01em; /* @kind font */--track-money:0em; /* @kind font */\n--track-eyebrow:.18em; /* @kind font */--track-nav:.14em; /* @kind font */\n--track-badge:.14em; /* @kind font */--track-label:.17em; /* @kind font */--track-num:0em; /* @kind font */\n\n/* ── measures ── */\n--measure-note:52ch; /* @kind spacing */--measure-body:64ch; /* @kind spacing */\n}\n\n/* CSX Bot — spacing, density, layout. Square geometry, compact rows: the owner looks at\n   this ten times a day, so the whole answer fits on one card. */\n:root{\n--space-1:4px; /* @kind spacing */--space-2:6px; /* @kind spacing */--space-3:9px; /* @kind spacing */\n--space-4:12px; /* @kind spacing */--space-5:14px; /* @kind spacing */--space-6:18px; /* @kind spacing */\n--space-7:22px; /* @kind spacing */--space-8:28px; /* @kind spacing */--space-9:34px; /* @kind spacing */\n--space-10:44px; /* @kind spacing */--space-11:56px; /* @kind spacing */--space-12:72px; /* @kind spacing */\n\n/* ── density ── */\n--row-h:32px; /* @kind spacing */\n--pad-row:7px 12px; /* @kind spacing */\n--pad-panel:12px; /* @kind spacing */\n--pad-panel-head:9px 12px; /* @kind spacing */\n--pad-cell-x:12px; /* @kind spacing */\n--gap-block:10px; /* @kind spacing */--gap-grid:10px; /* @kind spacing */\n--gap-stack:12px; /* @kind spacing */--gap-inline:9px; /* @kind spacing */--gap-inline-xs:6px; /* @kind spacing */\n\n/* ── controls ── */\n--control-h:34px; /* @kind spacing */--control-h-sm:26px; /* @kind spacing */--tap-min:44px; /* @kind spacing */\n--pad-button:0 14px; /* @kind spacing */--pad-button-sm:0 10px; /* @kind spacing */\n--pad-input:8px 10px; /* @kind spacing */\n--dot:7px; /* @kind spacing */--dot-lg:9px; /* @kind spacing */--mark-size:13px; /* @kind spacing */\n\n/* ── layout ── */\n--card-max:1040px; /* @kind spacing */\n--band-w:3px; /* @kind spacing */\n--curve-h:104px; /* @kind spacing */\n}\n\n/* CSX Bot — radii, borders, shadows, motion.\n   Zero radius everywhere; no shadow, no glow, no glass, no gradient. The colour should\n   look printed by a terminal, not lit. */\n:root{\n--radius-xs:0px;--radius-sm:0px;--radius-md:0px;--radius-lg:0px;--radius-circle:50%;\n--radius-panel:0px;--radius-control:0px;\n\n--hairline:1px solid var(--border-hairline); /* @kind other */\n--panel-border:1px solid var(--border-card); /* @kind other */\n--rule-h:2px; /* @kind spacing */\n\n--shadow-none:none; /* @kind shadow */--shadow-panel:none; /* @kind shadow */--shadow-modal:none; /* @kind shadow */\n\n--focus-ring:2px solid var(--brand); /* @kind other */\n\n/* ── motion: colour tra "4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:4px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Source<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-data)\">market-data · 1 m rollup<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">As of<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-data)\">trigger fire · t0<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Rows in / out<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-data)\">{{ insFlow }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 9px;background:var(--surface-sunken)\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow)\">Kept<\u002Fspan>\n            <x-import component-from-global-scope=\"CryptoSmithXBotDesignSystem_097238.Num\" value=\"{{ insKeptPct }}\" percent=\"{{ true }}\" decimals=\"1\" tone=\"data\" hint-size=\"70px,14px\"><\u002Fx-import>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-family:var(--font-body);font-size:11.5px;line-height:1.55;color:var(--text-muted)\">This node sits before the action boundary, so only pair attributes are offered. Values come from a closed list — a condition you can type is a condition nobody can validate or backtest.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLoop }}\">\n        <div style=\"padding:14px;border-bottom:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 9px;background:var(--surface-sunken)\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow)\">Attribute layer<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text-heading)\">Position<\u002Fspan>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Tick — what the condition is checked on<\u002Fspan>\n            <sc-raw-select value=\"{{ cfgTick }}\" sc-camel-on-change=\"{{ onTick }}\" style=\"width:100%;padding:8px 10px;background:var(--surface-card);border:1px solid var(--border-input);font-family:var(--font-mono);font-size:12px;color:var(--text-data);cursor:pointer\">\n              <sc-for list=\"{{ ticks }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <sc-if value=\"{{ tickMissing }}\">\n            <x-import component-from-global-scope=\"CryptoSmithXBotDesignSystem_097238.Tag\" tone=\"hold\" hint-size=\"130px,22px\">tick not set<\u002Fx-import>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Exit rules<\u002Fspan>\n            <sc-for list=\"{{ exitRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 9px;background:var(--surface-sunken)\">\n                <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-data)\">{{ r.attr }}<\u002Fspan>\n                <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);white-space:nowrap\">{{ r.test }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Exit path<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:10.5px;text-align:right;color:{{ exitInk }}\">{{ exitPathTxt }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">Position state<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:10.5px;text-align:right;color:var(--text-data)\">{{ posStateTxt }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-family:var(--font-body);font-size:11.5px;line-height:1.55;color:var(--text-muted)\">A loop sees one position, not the set. After a partial close the quantity is different, and the loop it returns to reads the new state — not the state at entry.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAction }}\">\n        <div style=\"padding:14px;border-bottom:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <x-import component-from-global-scope=\"CryptoSmithXBotDesignSystem_097238.SideBadge\" side=\"{{ actionSide }}\" hint-size=\"46px,14px\"><\u002Fx-import>\n            <span style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-faint)\">the boundary<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-family:var(--font-body);font-size:12px;line-height:1.55;color:var(--text-body)\">Here the set becomes singles. {{ actionSummary }} Everything above this node is a property of a pair; everything below is a property of a position. The dictionary swaps — you cannot put a stop on 24 h volume.<\u002Fp>\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)\">Before · pair<\u002Fspan>\n              <sc-for list=\"{{ pairAttrs }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <span style=\"font-family:var(--font-mono);font-size:10px;line-height:1.5;color:var(--text-faint)\">{{ o }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"width:1px;background:var(--border-hairline)\"><\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--brand-text)\">After iv style=\"padding:14px;border-bottom:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ genericRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)\">{{ r.label }}<\u002Fspan>\n              <sc-if value=\"{{ r.hasOptions }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-raw-select value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" style=\"width:100%;padding:8px 10px;background:var(--surface-card);border:1px solid var(--border-input);font-family:var(--font-mono);font-size:12px;color:var(--text-data);cursor:pointer\">\n                  <sc-for list=\"{{ r.options }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.plain }}\">\n                <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-data)\">{{ r.value }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p style=\"margin:0;font-family:var(--font-body);font-size:11.5px;line-height:1.55;color:var(--text-muted)\">{{ genericNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"padding:14px;border-bottom:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--eyebrow)\">Modeling rules<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-size:15px;line-height:1;color:var(--text-heading)\">TIPS<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">The <b style=\"color:var(--text-heading);font-weight:600\">trigger<\u002Fb> is the time anchor: every pair attribute is read at t0, once per fire.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">Arrows carry <b style=\"color:var(--text-heading);font-weight:600\">data<\u002Fb>, not control — an arrow is a set of pairs, and its thickness is how many.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">A <b style=\"color:var(--text-heading);font-weight:600\">merge<\u002Fb> is a union with dedupe by pair; on a collision the earlier branch wins its columns.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">An <b style=\"color:var(--text-heading);font-weight:600\">action<\u002Fb> node is the boundary: the set becomes singles and the attribute dictionary swaps.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">Every <b style=\"color:var(--text-heading);font-weight:600\">loop<\u002Fb> needs a tick and a path to close fully. A loop with no exit is a position that never closes.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\">A partial close changes the position — the loop it returns to reads the new quantity.<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:9px\"><i style=\"flex:none;width:5px;height:5px;margin-top:6px;background:var(--brand)\"><\u002Fi><span style=\"font-family:var(--font-body);font-size:11.5px;line-height:1.5;color:var(--text-muted)\"><b style=\"color:var(--text-heading);font-weight:600\">Run now<\u002Fb> is a snapshot, not a backtest: what this document would select on this minute's data.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      \n      <div style=\"margin-top:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border-hairline)\">\n        <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-faint)\">Not investment advice · own funds only<\u002Fspan>\n        <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-faint)\">Strategy modeler · document #a41f0c<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;day&quot;,&quot;night&quot;],&quot;default&quot;:&quot;day&quot;,&quot;tsType&quot;:&quot;'day' | 'night'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;flowMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;edgeLabel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;count&quot;,&quot;count+share&quot;,&quot;off&quot;],&quot;default&quot;:&quot;count&quot;,&quot;tsType&quot;:&quot;'count' | 'count+share' | 'off'&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;maxStroke&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:4,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Canvas&quot;}}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n\n  PAIR_ATTRS = ['change 24 h', 'momentum filter', 'distance from 40 h low', 'spread', 'book depth', 'quote volume 24 h'];\n  POS_ATTRS = ['unrealized pnl %', 'net unrealized pnl eur', 'time in position', 'quantity remaining', 'liquidation distance %', 'funding paid eur', 'trailing stop state', 'leverage'];\n  OPERATORS = ['>', '≥', '<', '≤', 'in range', 'crosses above', 'crosses below'];\n  THRESHOLDS = ['0 %', '1 %', '2.5 %', '5 %', '10 %'];\n  TICKS = ['— not set', 'every snapshot', '1 m close', '5 m close', '15 m close'];\n  SIZES = ['1 % equity', '2 % equity', '5 % equity', 'fixed 100 eur'];\n  LEVERAGES = ['2x', '3x', '5x', '10x'];\n  SCHEDULES = ['every 60 s', 'every 5 min', 'every 1 h', 'on funds available'];\n  MERGE_MODES = ['union · dedupe by pair', 'intersect · dedupe by pair'];\n\n  BASE = [\n    { id: 'trigger', kind: 'trigger', title: 'EVERY 60 s', badge: 'TRIGGER', x: 40, y: 470, w: 236, inKey: null, outKey: 'universe',\n      fields: [{ k: 'schedule', v: 'every 60 s' }, { k: 'anchor', v: 't0 = fire time' }, { k: 'universe', v: 'all perps' }],\n      cfg: { schedule: 'every 60 s' } },\n    { id: 'f-24h', kind: 'select', title: '24H CHANGE > 0', badge: 'SELECT', x: 330, y: 460, w: 250, inKey: 'universe', outKey: 'keep24',\n      fields: [{ k: 'attribute', v: 'change 24 h' }, { k: 'test', v: '> 0 %' }, { k: 'as of', v: 't0' }],\n      cfg: { attribute: 'change 24 h', operator: '>', threshold: '0 %' } },\n    { id: 'f-mom', kind: 'select', title: 'MOMENTUM RISING', badge: 'SELECT · A', x: 660, y: 210, w: 250, inKey: 'keep24', outKey: 'mom',\n      fields: [{ k: 'attribute', v: 'momentum filter' }, { k: 'window', v: 'last 6 h' }, { k: 'as of', v: 't0' }],\n      cfg: { attribute: 'momentum filter', operator: 'crosses above', threshold: '0 %' } },\n    { id: 'f-low', kind: 'select', title: 'NEAR 40H LOW', badge: 'SELECT · B', x: 660, y: 730, w: 250, inKey: 'keep24', outKey: 'low',\n      fields: [{ k: 'attribute', v: 'distance from 40 h low' }, { k: 'test', v: '≤ 10 % above low' }, { k: 'as of', v: 't0' }],\n      cfg: { attribute: 'distance from 40 h low', operator: '≤', threshold: '10 %' } },\n    { id: 'r-a', kind: 'rank', title: 'TAKE 1 · ASC', badge: 'RANK · A', x: 1000, y: 210, w: 236, inKey: 'mom', outKey: 'ra',\n      fields: [{ k: 'sort 1', v: 'spread · ascending' }, { k: 'limit', v: '1' }], cfg: { limit: '1' } },\n    { id: 'r-b', kind: 'rank', title: 'TAKE 4 · DESC, THEN ASC', badge: 'RANK · B', x: 1000, y: 730, w: 236, inKey: 'low', outKey: 'rb',\n      fields: [{ k: 'sort 1', v: 'book depth · descending' }, { k: 'sort 2', v: 'spread · ascending' }, { k: 'limit', v: '4' }], cfg: { limit: '4' } },\n    { id: 'merge', kind: 'merge', title: 'MERGE A + B', badge: 'MERGE', x: 1290, y: 470, w: 250, inKey: 'merged', outKey: 'merged',\n      fields: [{ k: 'mode', v: 'union · dedupe by pair' }, { k: 'priority', v: 'A over B' }, { k: 'columns', v: 'from surviving branch' }],\n      cfg: { mode: 'union · dedupe by pair' } },\n    { id: 'open-1', kind: 'long', title: 'OPEN LONG · 5x', badge: 'LONG', x: 1620, y: 190, w: 240, inKey: 'o1', outKey: 'o1',\n      fields: [{ k: 'size', v: '2 % equity' }, { k: 'leverage', v: '5x' }, { k: 'entry', v: 'market' }],\n      cfg: { size: '2 % equity', leverage: '5x' } },\n    { id: 'open-2', kind: 'long', title: 'OPEN LONG · 3x', badge: 'LONG', x: 1620, y: 470, w: 240, inKey: 'o2', outKey: 'o2',\n      fields: [{ k: 'size', v: '2 % equity' }, { k: 'leverage', v: '3x' }, { k: 'entry', v: 'market' }],\n      cfg: { size: '2 % equity', leverage: '3x' } },\n    { id: 'open-3', kind: 'short', title: 'OPEN SHORT · 5x', badge: 'SHORT', x: 1620, y: 750, w: 240, inKey: 'o3', outKey: 'o3',\n      fields: [{ k: 'size', v: '1 % equity' }, { k: 'leverage', v: '5x' }, { k: 'entry', v: 'market' }],\n      cfg: { size: '1 % equity', leverage: '5x' } },\n    { id: 'loop-1', kind: 'loop', title: 'MANAGE · TP / SL', badge: 'LOOP 1', x: 1990, y: 330, w: 254, inKey: 'merged', outKey: 'closed',\n      fields: [{ k: 'tick', v: '1 m close' }, { k: 'exit', v: 'take profit · stop · trail' }, { k: 'sees', v: 'position state' }],\n      cfg: { tick: '1 m close' } },\n    { id: 'loop-2', kind: 'loop', title: 'SCALE OUT 50 %', badge: 'LOOP 2', x: 1990, y: 760, w: 254, inKey: 'o3', outKey: 'o3',\n      fields: [{ k: 'tick', v: '— not set' }, { k: 'action', v: 'close 50 % of remaining' }, { k: 'then', v: 'back to LOOP 1' }],\n      cfg: { tick: '— not set' } },\n    { id: 'close', kind: 'terminal', title: 'CLOSE FULLY', badge: 'TERMINAL', x: 2360, y: 470, w: 226, inKey: 'closed', outKey: null,\n      fields: [{ k: 'effect', v: 'position closed' }, { k: 'journal', v: 'trade written' }], cfg: {} }\n  ];\n\n  EDGES = [\n    ['trigger', 'f-24h', 'universe', 'pre'],\n    ['f-24h', 'f-mom', 'keep24', 'pre'],\n    ['f-24h', 'f-low', 'keep24', 'pre'],\n    ['f-mom', 'r-a', 'mom', 'pre'],\n    ['f-low', 'r-b', 'low', 'pre'],\n    ['r-a', 'merge', 'ra', 'pre'],\n    ['r-b', 'merge', 'rb', 'pre'],\n    ['merge', 'open-1', 'o1', 'cand'],\n    ['merge', 'open-2', 'o2', 'cand'],\n    ['merge', 'open-3', 'o3', 'cand'],\n    ['open-1', 'loop-1', 'o1', 'post'],\n    ['open-2', 'loop-1', 'o2', 'post'],\n    ['open-3', 'loop-2', 'o3', 'post'],\n    ['loop-2', 'loop-1', 'o3', 'post'],\n    ['loop-1', 'close', 'closed', 'post']\n  ];\n\n  state = {\n    nodes: this.BASE.map(n => ({ ...n, fields: n.fields.map(f => ({ ...f })), cfg: { ...n.cfg } })),\n    view: { x: -170, y: -110, scale: 0.72 },\n    selected: 'f-24h',\n    showReport: false,\n    showExport: false,\n    theme: 'day',\n    source: 'snapshot',\n    ranAt: null,\n    marketsNow: null,\n    counts: { universe: 1006, keep24: 412, mom: 118, low: 74, ra: 1, rb: 4, merged: 5, o1: 2, o2: 2, o3: 1, closed: 5 }\n  };\n\n  componentDidMount() {\n    const t = this.props.theme === 'night' ? 'night' : 'day';\n    this.setState({ theme: t });\n    this.applyTheme(t);\n    const c = this.canvasRef.current;\n    if (c) c.addEventListener('wheel', this.onWheel, { passive: false });\n    window.addEventListener('mousemove', this.onMove);\n    window.addEventListener('mouseup', this.onUp);\n    this.probeApi();\n  }\n  componentWillUnmount() {\n    const c = this.canvasRef.current;\n    if (c) c.removeEventListener('wheel', this.onWheel);\n    window.removeEventListener('mousemove', this.onMove);\n    window.removeEventListener('mouseup', this.onUp);\n  }\n  applyTheme(t) {\n    const r = document.documentElement;\n    if (t === 'night') r.setAttribute('data-theme', 'night'); else r.removeAttribute('data-theme');\n  }\n\n  probeApi = async () => {\n    try {\n      const res = await fetch('https://blynai.meetluko.eu/api/public-stats', { mode: 'cors' });\n      if (!res.ok) return;\n      const j = await res.json();\n      const m = Number(j.marketsNow);\n      if (m > 0) this.setState({ marketsNow: m });\n    } catch (e) { /* build environment cannot reach the API — the snapshot stands in */ }\n  };\n\n  nodeH(n) { return 44 + n.fields.length * 16 + 9 + 29; }\n  nodeById(id) { return this.state.nodes.find(n => n.id === id); }\n\n  /* ── view ── */\n  onWheel = (e) => {\n    e.preventDefault();\n    const v = this.state.view;\n    const r = this.canvasRef.current.getBoundingClientRect();\n    const mx = e.clientX - r.left, my = e.clientY - r.top;\n    const s = Math.min(1.6, Math.max(0.24, v.scale * (e.deltaY > 0 ? 0.92 : 1.08)));\n    const k = s / v.scale;\n    this.setState({ view: { scale: s, x: mx - (mx - v.x) * k, y: my - (my - v.y) * k } });\n  };\n  zoomBy = (f) => {\n    const v = this.state.view;\n    const r = this.canvasRef.current.getBoundingClientRect();\n    const mx = r.width / 2, my = r.height / 2;\n    const s = Math.min(1.6, Math.max(0.24, v.scale * f));\n    const k = s / v.scale;\n    this.setState({ view: { scale: s, x: mx - (mx - v.x) * k, y: my - (my - v.y) * k } });\n  };\n  fit = () => {\n    const r = this.canvasRef.current.getBoundingClientRect();\n    const ns = this.state.nodes;\n    const x0 = Math.min(...ns.map(n => n.x)) - 40, x1 = Math.max(...ns.map(n => n.x + n.w)) + 40;\n    const y0 = Math.min(...ns.map(n => n.y)) - 60, y1 = Math.max(...ns.map(n => n.y + this.nodeH(n))) + 40;\n    const s = Math.min(1.4, Math.min((r.width - 24) / (x1 - x0), (r.height - 24) / (y1 - y0)));\n    this.setState({ view: { scale: s, x: -x0 * s + (r.width - (x1 - x0) * s) / 2, y: -y0 * s + (r.height - (y1 - y0) * s) / 2 } });\n  };\n  centerOn = (id) => {\n    const n = this.nodeById(id); if (!n) return;\n    const r = this.canvasRef.current.getBoundingClientRect();\n    const s = Math.max(this.state.view.scale, 0.7);\n    this.setState({ view: { scale: s, x: r.width / 2 - (n.x + n.w / 2) * s, y: r.height / 2 - (n.y + this.nodeH(n) / 2) * s } });\n  };\n\n  /* ── drag / pan ── */\n  onCanvasDown = (e) => { this.pan = { sx: e.clientX, sy: e.clientY, x: this.state.view.x, y: this.state.view.y }; };\n  startNodeDrag = (e, id) => {\n    e.stopPropagation();\n    const n = this.nodeById(id);\n    this.drag = { id, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false };\n    this.setState({ selected: id });\n  };\n  onMove = (e) => {\n    if (this.drag) {\n      const d = this.drag, s = this.state.view.scale;\n      const dx = (e.clientX - d.sx) / s, dy = (e.clientY - d.sy) / s;\n      if (Math.abs(dx) + Math.abs(dy) > 2) d.moved = true;\n      this.setState({ nodes: this.state.nodes.map(n => n.id === d.id ? { ...n, x: Math.round(d.ox + dx), y: Math.round(d.oy + dy) } : n) });\n    } else if (this.pan) {\n      const p = this.pan;\n      this.setState({ view: { ...this.state.view, x: p.x + (e.clientX - p.sx), y: p.y + (e.clientY - p.sy) } });\n    }\n  };\n  onUp = () => { this.drag = null; this.pan = null; };\n\n  /* ── counts ── */\n  runNow = () => {\n    const j = () => 0.86 + Math.random() * 0.3;\n    const u = this.state.marketsNow || Math.round(1006 * j());\n    const keep24 = Math.max(4, Math.round(u * 0.41 * j()));\n    const mom = Math.max(1, Math.round(keep24 * 0.29 * j()));\n    const low = Math.max(1, Math.round(keep24 * 0.18 * j()));\n    const ra = Math.min(1, mom), rb = Math.min(4, low);\n    const merged = ra + rb;\n    const o1 = Math.min(2, merged), o2 = Math.min(2, Math.max(0, merged - o1)), o3 = Math.max(0, merged - o1 - o2);\n    this.setState({\n      counts: { universe: u, keep24, mom, low, ra, rb, merged, o1, o2, o3, closed: merged },\n      source: this.state.marketsNow ? 'api' : 'snapshot',\n      ranAt: new Date().toISOString().slice(11, 19) + 'Z'\n    });\n  };\n\n  /* ── validation ── */\n  reachesTerminal(id, seen) {\n    seen = seen || {};\n    if (id === 'close') return true;\n    if (seen[id]) return false;\n    seen[id] = 1;\n    return this.EDGES.filter(e => e[0] === id).some(e => this.reachesTerminal(e[1], seen));\n  }\n  buildFindings() {\n    const c = this.state.counts, out = [];\n    this.state.nodes.filter(n => n.kind === 'loop').forEach(n => {\n      if (String(n.cfg.tick).indexOf('not set') >= 0) out.push({\n        id: n.id, sev: 'error', rule: 'LOOP.TICK', title: n.title + ' — tick frequency not set',\n        msg: 'A take-profit checked on every snapshot and one checked on 1 m closes are different strategies. Without a tick this loop cannot be executed.'\n      });\n      if (!this.reachesTerminal(n.id)) out.push({\n        id: n.id, sev: 'error', rule: 'LOOP.EXIT', title: n.title + ' — no path to close fully',\n        msg: 'Every loop needs a route to a terminal close. A loop without one is a position that never closes.'\n      });\n    });\n    this.state.nodes.filter(n => n.kind === 'select').forEach(n => {\n      const i = c[n.inKey], o = c[n.outKey];\n      if (i && o / i >= 0.95) out.push({ id: n.id, sev: 'warning', rule: 'FILTER.WIDE', title: n.title + ' — keeps almost everything', msg: 'This node passed ' + o + ' of ' + i + ' rows in the last run. A filter that cuts nothing is not a filter.' });\n      if (i && o / i <= 0.01) out.push({ id: n.id, sev: 'warning', rule: 'FILTER.NARROW', title: n.title + ' — cuts almost everything', msg: 'Only ' + o + ' of ' + i + ' rows survived. Downstream ranking has nothing to work with.' });\n    });\n    if (c.ra + c.rb === c.merged) out.push({ id: 'merge', sev: 'hint', rule: 'MERGE.DEDUPE', title: 'MERGE A + B — dedupe removed nothing', msg: 'Branches A and B did not overlap in the last run, so the column-priority rule was never exercised.' });\n    if (c.rb >= 2) out.push({ id: 'r-b', sev: 'hint', rule: 'RANK.TIE', title: 'TAKE 4 · DESC, THEN ASC — second sort key unused', msg: 'The first key produced no ties in the last run; the tie-breaker is untested.' });\n    return out;\n  }\n\n  setCfg(id, key, value, fieldKey) {\n    this.setState({\n      nodes: this.state.nodes.map(n => {\n        if (n.id !== id) return n;\n        const nn = { ...n, cfg: { ...n.cfg, [key]: value }, fields: n.fields.map(f => ({ ...f })) };\n        const fk = fieldKey || key;\n        const f = nn.fields.find(x => x.k === fk);\n        if (f) f.v = value;\n        if (key === 'operator' || key === 'threshold') {\n          const t = nn.fields.find(x => x.k === 'test');\n          if (t) t.v = nn.cfg.operator + ' ' + nn.cfg.threshold;\n        }\n        return nn;\n      })\n    });\n  }\n\n  renderVals() {\n    const st = this.state, c = st.counts, sel = this.nodeById(st.selected);\n    const maxStroke = Number(this.props.maxStroke ?? 7);\n    const labelMode = this.props.edgeLabel ?? 'count';\n    const motion = (this.props.flowMotion ?? true);\n    const ACCENT = { trigger: 'var(--brand-text)', select: 'var(--text-muted)', rank: 'var(--text-muted)', merge: 'var(--text-heading)', long: 'var(--long)', short: 'var(--short)', loop: 'var(--state-hold-ink)', terminal: 'var(--text-heading)' };\n\n    const nodes = st.nodes.map(n => {\n      const h = this.nodeH(n);\n      const inN = n.inKey ? c[n.inKey] : null, outN = n.outKey ? c[n.outKey] : null;\n      const pct = (inN && outN != null) ? Math.round((outN / inN) * 100) : null;\n      let pctInk = 'var(--text-faint)';\n      if (pct === 100 || pct === 0) pctInk = 'var(--state-hold-ink)';\n      return {\n        ...n, h,\n        accent: ACCENT[n.kind], bd: st.selected === n.id ? 'var(--border-strong)' : 'var(--border-card)',\n        hasIn: !!n.inKey, hasOut: !!n.outKey,\n        inLabel: n.inKey ? 'prev' : '—', outLabel: n.outKey ? 'next' : '—',\n        inN: inN == null ? '—' : inN.toLocaleString('en-GB'),\n        outN: outN == null ? '—' : outN.toLocaleString('en-GB'),\n        pctTxt: pct == null ? '' : pct + '%', pctInk,\n        onDown: (e) => this.startNodeDrag(e, n.id)\n      };\n    });\n    const byId = {}; nodes.forEach(n => { byId[n.id] = n; });\n\n    const preMax = Math.max(1, c.universe), postMax = Math.max(1, c.merged);\n    const edges = this.EDGES.map(([from, to, key, zone]) => {\n      const a = byId[from], b = byId[to];\n      const ax = a.x + a.w, ay = a.y + a.h - 15, bx = b.x, by = b.y + b.h - 15;\n      const dx = Math.max(70, Math.abs(bx - ax) * 0.5);\n      const c1x = ax + dx, c2x = bx - dx;\n      const n = c[key] ?? 0;\n      const post = zone === 'post';\n      const max = post ? postMax : preMax;\n      const w = Math.max(1.6, Math.min(maxStroke, 1.6 + (maxStroke - 1.6) * Math.sqrt(n / max)));\n      let ink = 'var(--text-muted)';\n      if (post) ink = a.kind === 'long' ? 'var(--long)' : a.kind === 'short' ? 'var(--short)' : a.kind === 'loop' && to === 'close' ? 'var(--text-heading)' : 'var(--state-hold-ink)';\n      const unit = post ? 'pos' : zone === 'cand' ? 'cand' : 'pairs';\n      const share = zone === 'pre' && c[a.outKey] ? Math.round((n / Math.max(1, c[a.inKey] || c.universe)) * 100) : null;\n      return {\n        d: 'M ' + ax + ' ' + ay + ' C ' + c1x + ' ' + ay + ', ' + c2x + ' ' + by + ', ' + bx + ' ' + by,\n        lx: Math.round((ax + 3 * c1x + 3 * c2x + bx) / 8), ly: Math.round((ay + 3 * ay + 3 * by + by) / 8),\n        w: Math.round(w * 10) / 10, ink,\n        dash: post ? '2 11' : '7 9', cap: post ? 'round' : 'butt',\n        anim: motion ? (post ? 'csxdots 1.4s linear infinite' : 'csxdash 1.1s linear infinite') : 'none',\n        n: labelMode === 'off' ? '' : n.toLocaleString('en-GB'),\n        unit: labelMode === 'off' ? '' : labelMode === 'count+share' && share != null ? unit + ' · ' + share + '%' : unit\n      };\n    });\n\n    const findings = this.buildFindings();\n    const errs = findings.filter(f => f.sev === 'error').length;\n    const warns = findings.filter(f => f.sev === 'warning').length;\n    const hints = findings.filter(f => f.sev === 'hint').length;\n    const SEVINK = { error: 'var(--money-down-ink)', warning: 'var(--state-hold-ink)', hint: 'var(--brand-text)' };\n    const loops = st.nodes.filter(n => n.kind === 'loop');\n    const tickSet = loops.filter(n => String(n.cfg.tick).indexOf('not set') < 0).length;\n    const exitOk = loops.every(n => this.reachesTerminal(n.id));\n\n    const isFilter = !!sel && sel.kind === 'select';\n    const isLoop = !!sel && sel.kind === 'loop';\n    const isAction = !!sel && (sel.kind === 'long' || sel.kind === 'short');\n    const isGeneric = !!sel && !isFilter && !isLoop && !isAction;\n\n    const genericRows = [];\n    let genericNote = '';\n    if (isGeneric && sel.kind === 'trigger') {\n      genericRows.push({ label: 'Schedule', value: sel.cfg.schedule, options: this.SCHEDULES, hasOptions: true, plain: false, onChange: (e) => this.setCfg(sel.id, 'schedule', e.target.value) });\n      genericRows.push({ label: 'Time anchor', value: 't0 = fire time · every attribute read once', options: null, hasOptions: false, plain: true });\n      genericRows.push({ label: 'Universe', value: (st.marketsNow || c.universe) + ' perps at t0', options: null, hasOptions: false, plain: true });\n      genericNote = 'The trigger is part of the document, not a setting beside it: the same funnel on another schedule is another strategy.';\n    } else if (isGeneric && sel.kind === 'merge') {\n      genericRows.push({ label: 'Mode', value: sel.cfg.mode, options: this.MERGE_MODES, hasOptions: true, plain: false, onChange: (e) => this.setCfg(sel.id, 'mode', e.target.value) });\n      genericRows.push({ label: 'Priority', value: 'branch A over branch B', options: null, hasOptions: false, plain: true });\n      genericRows.push({ label: 'Rows in / out', value: c.ra + ' + ' + c.rb + ' → ' + c.merged, options: null, hasOptions: false, plain: true });\n      genericRows.push({ label: 'Collisions', value: (c.ra + c.rb - c.merged) + ' pair(s) in both branches', options: null, hasOptions: false, plain: true });\n      genericNote = 'On a collision the earlier branch keeps its computed columns, so you can always tell which version of a pair survived.';\n    } else if (isGeneric && sel.kind === 'rank') {\n      genericRows.push({ label: 'Limit', value: sel.cfg.limit, options: ['1', '2', '4', '8'], hasOptions: true, plain: false, onChange: (e) => this.setCfg(sel.id, 'limit', e.target.value, 'limit') });\n      sel.fields.filter(f => f.k.indexOf('sort') === 0).forEach(f => genericRows.push({ label: f.k, value: f.v, options: null, hasOptions: false, plain: true }));\n      genericRows.push({ label: 'Rows in / out', value: c[sel.inKey] + ' → ' + c[sel.outKey], options: null, hasOptions: false, plain: true });\n      genericNote = 'Sort keys are applied in order and read pair attributes at t0. Ranking never changes a value — it only chooses rows.';\n    } else if (isGeneric && sel.kind === 'terminal') {\n      genericRows.push({ label: 'Effect', value: 'position closed · quantity 0', options: null, hasOptions: false, plain: true });\n      genericRows.push({ label: 'Journal', value: 'trade written to today.trades[]', options: null, hasOptions: false, plain: true });\n      genericRows.push({ label: 'Positions closed in run', value: String(c.closed), options: null, hasOptions: false, plain: true });\n      genericNote = 'Terminal node: nothing leaves it. Every loop in the document must be able to reach this node.';\n    }\n\n    return {\n      canvasRef: this.canvasRef,\n      nodes, edges,\n      worldTransform: 'translate(' + Math.round(st.view.x) + 'px,' + Math.round(st.view.y) + 'px) scale(' + st.view.scale.toFixed(3) + ')',\n      zoomTxt: Math.round(st.view.scale * 100) + '%',\n      themeName: st.theme,\n      onTheme: (t) => { this.setState({ theme: t }); this.applyTheme(t); },\n      selectedLabel: sel ? sel.id + ' · ' + sel.badge.toLowerCase() : 'nothing selected',\n      dataLabel: st.source === 'api' ? 'api · ' + (st.ranAt || 'live') : st.ranAt ? 'snapshot · ' + st.ranAt : 'snapshot · illustrative',\n      onRunNow: this.runNow,\n      onValidate: () => this.setState({ showReport: true }),\n      onCloseReport: () => this.setState({ showReport: false }),\n      onExport: () => this.setState({ showExport: true }),\n      onCloseExport: () => this.setState({ showExport: false }),\n      onSave: () => this.setState({ showReport: false, showExport: false }),\n      onAutoLayout: () => this.setState({ nodes: st.nodes.map(n => ({ ...n, x: this.BASE.find(b => b.id === n.id).x, y: this.BASE.find(b => b.id === n.id).y })) }),\n      onZoomIn: () => this.zoomBy(1.12), onZoomOut: () => this.zoomBy(0.89),\n      onFit: this.fit, onResetView: () => this.setState({ view: { x: -170, y: -110, scale: 0.72 } }),\n      onCanvasDown: this.onCanvasDown,\n      showReport: st.showReport, showExport: st.showExport,\n      exportJson: JSON.stringify({\n        strategy: 'momentum-v4', version: 'a41f0c', trigger: { schedule: this.nodeById('trigger').cfg.schedule, anchor: 't0' },\n        nodes: st.nodes.map(n => ({ id: n.id, kind: n.kind, title: n.title, cfg: n.cfg })),\n        edges: this.EDGES.map(([f, t]) => ({ from: f, to: t })),\n        lastRun: { source: st.source, at: st.ranAt, counts: c }\n      }, null, 2),\n\n      insTitle: sel ? sel.title : 'Nothing selected',\n      insSub: sel ? 'Editing ' + sel.id + ' — ' + (isFilter ? 'set filter' : isLoop ? 'position loop' : isAction ? 'action node · boundary' : sel.kind + ' node') : 'Click a node on the canvas.',\n      isFilter, isLoop, isAction, isGeneric,\n      pairAttrs: this.PAIR_ATTRS, posAttrs: this.POS_ATTRS, operators: this.OPERATORS, thresholds: this.THRESHOLDS,\n      ticks: this.TICKS, sizes: this.SIZES, leverages: this.LEVERAGES,\n      cfgAttribute: sel && sel.cfg.attribute, cfgOperator: sel && sel.cfg.operator, cfgThreshold: sel && sel.cfg.threshold,\n      cfgTick: sel && sel.cfg.tick, cfgSize: sel && sel.cfg.size, cfgLeverage: sel && sel.cfg.leverage,\n      onAttribute: (e) => this.setCfg(sel.id, 'attribute', e.target.value),\n      onOperator: (e) => this.setCfg(sel.id, 'operator', e.target.value),\n      onThreshold: (e) => this.setCfg(sel.id, 'threshold', e.target.value),\n      onTick: (e) => this.setCfg(sel.id, 'tick', e.target.value),\n      onSize: (e) => this.setCfg(sel.id, 'size', e.target.value),\n      onLeverage: (e) => this.setCfg(sel.id, 'leverage', e.target.value),\n      insFlow: isFilter ? c[sel.inKey] + ' → ' + c[sel.outKey] : '—',\n      insKeptPct: isFilter && c[sel.inKey] ? (c[sel.outKey] / c[sel.inKey]) * 100 : null,\n      tickMissing: isLoop && String(sel.cfg.tick).indexOf('not set') >= 0,\n      exitRules: isLoop && sel.id === 'loop-1'\n        ? [{ attr: 'unrealized pnl %', test: '≥ 2.5 %' }, { attr: 'unrealized pnl %', test: '≤ −1.5 %' }, { attr: 'trailing stop state', test: 'is armed' }]\n        : [{ attr: 'unrealized pnl %', test: '≥ 1.5 %' }, { attr: 'quantity remaining', test: 'close 50 %' }, { attr: 'time in position', test: '≥ 45 min' }],\n      exitPathTxt: isLoop ? (this.reachesTerminal(st.selected) ? (sel.id === 'loop-1' ? 'direct → CLOSE FULLY' : 'via LOOP 1 → CLOSE FULLY') : 'none — position never closes') : '—',\n      exitInk: isLoop && !this.reachesTerminal(st.selected) ? 'var(--money-down-ink)' : 'var(--text-data)',\n      posStateTxt: isLoop && sel.id === 'loop-2' ? 'quantity halves before the return' : 'entry quantity, unless a loop reduced it',\n      actionSide: isAction ? (sel.kind === 'long' ? 'LONG' : 'SHORT') : 'LONG',\n      actionSummary: isAction ? c.merged + ' candidates arrived at the boundary in the last run and ' + c[sel.outKey] + ' of them opened here.' : '',\n      genericRows, genericNote,\n\n      verdictTitle: errs ? 'NOT EXECUTABLE' : 'EXECUTABLE',\n      verdictTag: errs ? errs + ' blocking' : 'no blockers',\n      verdictCounts: errs + ' error · ' + warns + ' warning · ' + hints + ' hint',\n      invariants: [\n        { label: 'every loop reaches close fully', state: exitOk ? 'ok' : 'fail', ink: exitOk ? 'var(--money-up-ink)' : 'var(--money-down-ink)' },\n        { label: 'tick set on every loop', state: tickSet + ' of ' + loops.length, ink: tickSet === loops.length ? 'var(--money-up-ink)' : 'var(--money-down-ink)' },\n        { label: 'no attribute crosses the boundary', state: 'ok', ink: 'var(--money-up-ink)' },\n        { label: 'every filter cuts something', state: warns ? 'review' : 'ok', ink: warns ? 'var(--state-hold-ink)' : 'var(--money-up-ink)' },\n        { label: 'merge priority is defined', state: 'ok', ink: 'var(--money-up-ink)' }\n      ],\n      findings: findings.map(f => ({ ...f, ink: SEVINK[f.sev], onClick: () => { this.setState({ selected: f.id }); this.centerOn(f.id); } }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<
