# Публичный вход в Arena. Ставится на хосте в /opt/traefik/dynamic/, где у traefik
# включён file-provider с watch: true — файл подхватывается без перезапуска.
#
# Раньше этот роутер существовал только как комментарий в docker-compose.prod.yml.
# Единственная копия знания о том, как сайт становится доступен, лежала в прозе, и
# восстановить её после потери сервера было бы неоткуда. Теперь она в git — хотя
# vps-deploy.sh её не разворачивает: он тянет только docker-compose.prod.yml, так
# что файл ставится на хост один раз руками.
#
#     scp deploy/traefik/cryptosmithx-arena.yml root@<host>:/opt/traefik/dynamic/
#
# Ставить ТОЛЬКО после того, как контейнер arena поднялся: пока бэкенда нет, этот
# роутер превращает работающий редирект /arena в 502.
http:
  routers:
    cryptosmithx-arena:
      # Priority выставлен явно, хотя traefik и сам считает его по длине правила и это
      # правило длиннее, чем Host() у webapp. Явное число здесь потому, что цена ошибки
      # несимметрична: если роутер webapp однажды окажется приоритетнее, он проглотит
      # /arena целиком, и симптом будет не «Arena не работает», а «Arena отдаёт чужую
      # страницу» — то есть то, что заметят не сразу.
      rule: Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/arena`)
      priority: 100
      entryPoints: [websecure]
      service: cryptosmithx-arena
      tls:
        certResolver: letsencrypt
  services:
    cryptosmithx-arena:
      loadBalancer:
        servers:
          # 10.8.0.1 — это wg0 самого хоста, тот же адрес, на который опубликован webapp
          # (7777). Контейнер публикует 7778 только туда, наружу порт не открыт.
          - url: http://10.8.0.1:7778
