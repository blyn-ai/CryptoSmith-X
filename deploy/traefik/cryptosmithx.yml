# ── Публичный вход в CryptoSmith X ────────────────────────────────────────────────
#
# Ставится на хосте в /opt/traefik/dynamic/, где у traefik включён file-provider с
# watch: true — файл подхватывается без перезапуска. vps-deploy.sh его НЕ разворачивает,
# он тянет только docker-compose.prod.yml, так что файл кладётся руками:
#
#     scp deploy/traefik/cryptosmithx.yml root@38.242.248.83:/opt/traefik/dynamic/
#
# ЗАМЕНЯЕТ ДВА ФАЙЛА: cryptosmithx.yml (роутер админки) и
# cryptosmithx-webapp-studio.yml. Второй обязан быть удалён с хоста в тот же момент —
# он объявляет ровно то же правило Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/studio`)
# с тем же priority 100, а два роутера с одинаковым правилом и приоритетом traefik
# разрешает не в чью-то пользу, а как получится.
#
# ── Почему обе A-записи смотрят на одну машину ────────────────────────────────────
#
#     cryptosmithx.blynai.eu       A  38.242.248.83   (proxied)
#     cryptosmithx-test.blynai.eu  A  38.242.248.83   (proxied)
#
# Обе указывают на тестовый хост, потому что у прода нет публичного адреса: он живёт
# внутри сети клиента за NAT, и снаружи до него не дотянуться. Поэтому traefik здесь —
# единственный вход для обоих контуров, и разводит он их по имени хоста, а не по адресу.
# Голое имя — прод, имя с -test — тест. Так и должно читаться: адрес без уточнения
# ведёт туда, где живут настоящие данные.
#
# ── Куда ходит каждый ─────────────────────────────────────────────────────────────
#
#   cryptosmithx.blynai.eu       → 10.11.12.28  через wg1 (10.11.12.29 → 10.11.12.28)
#   cryptosmithx-test.blynai.eu  → 10.8.0.1     — wg0 самого этого хоста
#
# 10.8.0.1 — адрес, на который тестовые контейнеры публикуют 7777 и 7778; наружу эти
# порты не открыты. На проде контейнеры публикуют те же порты на 10.11.12.28, и
# добраться до них можно только по VPN — что и делает этот файл.
#
# Плечо до прода стоит около 74 мс RTT, и это цена, которую платит каждый запрос к
# публичному сайту. Альтернативы нет, пока у прода нет своего входа.
#
# ── Приоритеты ────────────────────────────────────────────────────────────────────
#
# Проставлены явно, хотя traefik и сам считает их по длине правила, а правило со
# PathPrefix длиннее голого Host(). Явные числа здесь потому, что цена ошибки
# несимметрична: если роутер админки однажды окажется приоритетнее, он проглотит
# /studio целиком, и симптом будет не «Studio не работает», а «Studio отдаёт чужую
# страницу» — то есть то, что заметят не сразу.
#
# StripPrefix нет и не должно быть: приложение поднимается с UsePathBase("/studio") и
# ждёт префикс на входе. Снять его здесь значит сломать все ссылки внутри страницы.
#
# ── Публичный API ─────────────────────────────────────────────────────────────────
#
# /v1, /openapi и /scalar ведут на MarketData.Api прода (порт 8080), и только на прод:
# у теста этого сервиса нет вовсе — docker-compose.prod.yml его не поднимает.
#
# Открывать это наружу можно ровно потому, что открывать нечего: в MapMarketDataApi
# нет ни одного MapPost/MapPut/MapDelete, только семь GET. Приём событий от ботов —
# /api/ingest/events — живёт в другом приложении (WebApp.Admin), в другом контейнере
# и на другом порту, и этими правилами не затрагивается. Проверять это надо при
# каждом добавлении маршрута в API: с этой строкой /v1 стал анонимным входом.
#
# /openapi/v1.json и /scalar/v1 идут туда же намеренно — контракт для машин без
# читаемого описания рядом является контрактом только на словах.
#
# Нет middleware на админке — их не было и на роутере, который этот файл заменяет.
# Админка закрыта собственным логином (/admin отдаёт 302 на форму входа), и traefik
# перед ней ничего не проверяет. Это записано здесь, чтобы отсутствие basicauth
# читалось как решение, а не как забытая строка.
#
# ── Как проверить, что оно правда так маршрутизируется ────────────────────────────
#
# Код ответа не доказывает ничего: оба контура отдают 200, а страницы у них байт в
# байт одинаковы, пока данные совпадают. `ss` тоже не годится — соединения к бэкенду
# живут доли секунды и между выборками их не видно. Считать надо трафик на VPN:
#
#     rx() { awk -v i="wg1:" '$1==i{print $2}' /proc/net/dev; }
#     a=$(rx); curl -sk -o /dev/null --resolve cryptosmithx.blynai.eu:443:127.0.0.1 \
#         https://cryptosmithx.blynai.eu/studio; echo $(( $(rx) - a ))
#
# У прод-имени счётчик растёт, у -test не двигается вовсе. Ожидаемая величина мала и
# это не ошибка: бэкенд отдаёт gzip, и страница в 144 КиБ уезжает по проводу в 7,3 КиБ.
# Ждать «примерно размер страницы» — верный способ решить, что маршрут не работает,
# когда он работает.
#
# Резервные копии предыдущих версий — в /opt/traefik/dynamic-backups/, не рядом с
# конфигом. Traefik разбирает только .yml/.yaml/.toml/.json, так что `.bak.<дата>` он
# и не читал бы, но каталог, за которым он следит, — не место для черновиков.
# ──────────────────────────────────────────────────────────────────────────────────

http:
  routers:
    # ── прод, через VPN ───────────────────────────────────────────────────────────
    csx-prod-studio:
      rule: Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/studio`)
      priority: 100
      entryPoints: [websecure]
      service: csx-prod-studio
      tls:
        certResolver: letsencrypt

    # The front door. Path(`/`) is the ROOT AND NOTHING ELSE — PathPrefix(`/`) would match every
    # address on the host and swallow the admin console whole. Studio, not the admin application:
    # a visitor arriving at the bare name should land on the product, and /admin is where the
    # console lives.
    csx-prod-root:
      rule: Host(`cryptosmithx.blynai.eu`) && Path(`/`)
      priority: 100
      entryPoints: [websecure]
      service: csx-prod-studio
      tls:
        certResolver: letsencrypt

    # Arena is what the pair comparison was called before it became Studio. The name is still in
    # circulation — in the storefront's own header, in links people saved — so the address answers
    # instead of 404ing, and answers by pointing at the one canonical place rather than serving a
    # second copy of the same application under a second name.
    csx-prod-arena:
      rule: Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/arena`)
      priority: 100
      middlewares: [arena-to-studio]
      entryPoints: [websecure]
      service: csx-prod-studio
      tls:
        certResolver: letsencrypt

    # The agent — the bot owner's own surface, in its own container on 7779. Same priority as
    # studio and api: all three beat the bare Host() of the admin console, and their prefixes do
    # not overlap each other. No stripPrefix, for the reason stated at the top of this file: the
    # application starts with UsePathBase("/agent") and expects the prefix on the way in.
    #
    # This address used to reach the admin console, which redirected it to a static mock at
    # /feature-demo/agent. It no longer does, and the mock keeps its own address — the same move
    # /studio made when Studio became real.
    csx-prod-agent:
      rule: Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/agent`)
      priority: 100
      entryPoints: [websecure]
      service: csx-prod-agent
      tls:
        certResolver: letsencrypt

    csx-prod-admin:
      rule: Host(`cryptosmithx.blynai.eu`)
      priority: 10
      entryPoints: [websecure]
      service: csx-prod-admin
      tls:
        certResolver: letsencrypt

    # API прода: контракт для машин. Тот же приоритет, что у studio, — оба выигрывают
    # у голого Host() админки, и между собой их префиксы не пересекаются.
    csx-prod-api:
      rule: Host(`cryptosmithx.blynai.eu`) && (PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/openapi`) || PathPrefix(`/scalar`))
      middlewares: [api-front-door]
      priority: 100
      entryPoints: [websecure]
      service: csx-prod-api
      tls:
        certResolver: letsencrypt

    # ── тест, локально ────────────────────────────────────────────────────────────
    csx-test-studio:
      rule: Host(`cryptosmithx-test.blynai.eu`) && PathPrefix(`/studio`)
      priority: 100
      entryPoints: [websecure]
      service: csx-test-studio
      tls:
        certResolver: letsencrypt

    csx-test-root:
      rule: Host(`cryptosmithx-test.blynai.eu`) && Path(`/`)
      priority: 100
      entryPoints: [websecure]
      service: csx-test-studio
      tls:
        certResolver: letsencrypt

    # The test contour answers the same four public addresses as production, against its OWN
    # containers. /api pointed at production would put production figures behind a test hostname,
    # which is a worse answer than none.
    csx-test-api:
      rule: Host(`cryptosmithx-test.blynai.eu`) && (PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/openapi`) || PathPrefix(`/scalar`))
      priority: 100
      middlewares: [api-front-door]
      entryPoints: [websecure]
      service: csx-test-api
      tls:
        certResolver: letsencrypt

    # Arena is what the pair comparison was called before it became Studio. The name is still in
    # circulation — in the storefront's own header, in links people saved — so the address answers
    # instead of 404ing, and answers by pointing at the one canonical place rather than serving a
    # second copy of the same application under a second name.
    csx-test-arena:
      rule: Host(`cryptosmithx-test.blynai.eu`) && PathPrefix(`/arena`)
      priority: 100
      middlewares: [arena-to-studio]
      entryPoints: [websecure]
      service: csx-test-studio
      tls:
        certResolver: letsencrypt

    csx-test-agent:
      rule: Host(`cryptosmithx-test.blynai.eu`) && PathPrefix(`/agent`)
      priority: 100
      entryPoints: [websecure]
      service: csx-test-agent
      tls:
        certResolver: letsencrypt

    csx-test-admin:
      rule: Host(`cryptosmithx-test.blynai.eu`)
      priority: 10
      entryPoints: [websecure]
      service: csx-test-admin
      tls:
        certResolver: letsencrypt

  services:
    csx-prod-studio:
      loadBalancer:
        servers:
          - url: http://10.11.12.28:7778
    csx-prod-admin:
      loadBalancer:
        servers:
          - url: http://10.11.12.28:7777
    csx-prod-api:
      loadBalancer:
        servers:
          - url: http://10.11.12.28:8080
    csx-prod-agent:
      loadBalancer:
        # 10.8.0.1, NOT 10.11.12.28 like its prod neighbours: the agent runs in ONE copy, on THIS
        # host, beside the one trading bot whose database it writes — the datahub has no bot stack
        # and nothing listening on 7779, which is exactly the 502 this line used to produce. Both
        # contours' /agent routers point at the same instance, per the owner's one-bot instruction
        # in docker-compose.prod.yml.
        servers:
          - url: http://10.8.0.1:7779
    csx-test-api:
      loadBalancer:
        # 7780 on the test host, not 8080: that address was already held there by an unrelated
        # container. See the ports comment on the api service in docker-compose.prod.yml.
        servers:
          - url: http://10.8.0.1:7780
    csx-test-studio:
      loadBalancer:
        servers:
          - url: http://10.8.0.1:7778
    csx-test-admin:
      loadBalancer:
        servers:
          - url: http://10.8.0.1:7777
    csx-test-agent:
      loadBalancer:
        servers:
          - url: http://10.8.0.1:7779

  middlewares:
    # /api is the address a person types; /v1 is the address a program calls. The API application
    # serves the second and a reference page for it, and knows nothing about the first — so the door
    # is opened here rather than by teaching the app a second name for itself.
    #
    # Exact path only. A prefix rule would swallow /api/anything and redirect a caller who typed a
    # real path into the reference page, which is a worse failure than a 404 because it answers 200.
    # /arena/BTC keeps its tail: the old address and the new one differ only in the first segment,
    # so a saved link to a pair still lands on that pair.
    arena-to-studio:
      redirectRegex:
        regex: "^https://([^/]+)/arena(/.*)?$"
        replacement: "https://${1}/studio${2}"
        permanent: false

    api-front-door:
      redirectRegex:
        regex: "^https://([^/]+)/api/?$"
        replacement: "https://${1}/scalar/v1"
        permanent: false
