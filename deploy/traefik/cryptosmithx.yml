# ── Публичный вход в CryptoSmith X ────────────────────────────────────────────────
#
# Ставится на хосте в /opt/traefik/dynamic/, где у traefik включён file-provider с
# watch: true — файл подхватывается без перезапуска. vps-deploy.sh его НЕ разворачивает,
# он тянет только docker-compose.prod.yml, так что файл кладётся руками:
#
#     scp deploy/traefik/cryptosmithx.yml root@38.242.248.83:/opt/traefik/dynamic/
#
# ЗАМЕНЯЕТ ДВА ФАЙЛА: cryptosmithx.yml (роутер админки) и
# cryptosmithx-webapp-studio.yml. Второй обязан быть удалён с хоста в тот же момент —
# он объявляет ровно то же правило Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/studio`)
# с тем же priority 100, а два роутера с одинаковым правилом и приоритетом traefik
# разрешает не в чью-то пользу, а как получится.
#
# ── Почему обе A-записи смотрят на одну машину ────────────────────────────────────
#
#     cryptosmithx.blynai.eu       A  38.242.248.83   (proxied)
#     cryptosmithx-test.blynai.eu  A  38.242.248.83   (proxied)
#
# Обе указывают на тестовый хост, потому что у прода нет публичного адреса: он живёт
# внутри сети клиента за NAT, и снаружи до него не дотянуться. Поэтому traefik здесь —
# единственный вход для обоих контуров, и разводит он их по имени хоста, а не по адресу.
# Голое имя — прод, имя с -test — тест. Так и должно читаться: адрес без уточнения
# ведёт туда, где живут настоящие данные.
#
# ── Куда ходит каждый ─────────────────────────────────────────────────────────────
#
#   cryptosmithx.blynai.eu       → 10.11.12.28  через wg1 (10.11.12.29 → 10.11.12.28)
#   cryptosmithx-test.blynai.eu  → 10.8.0.1     — wg0 самого этого хоста
#
# 10.8.0.1 — адрес, на который тестовые контейнеры публикуют 7777 и 7778; наружу эти
# порты не открыты. На проде контейнеры публикуют те же порты на 10.11.12.28, и
# добраться до них можно только по VPN — что и делает этот файл.
#
# Плечо до прода стоит около 74 мс RTT, и это цена, которую платит каждый запрос к
# публичному сайту. Альтернативы нет, пока у прода нет своего входа.
#
# ── Приоритеты ────────────────────────────────────────────────────────────────────
#
# Проставлены явно, хотя traefik и сам считает их по длине правила, а правило со
# PathPrefix длиннее голого Host(). Явные числа здесь потому, что цена ошибки
# несимметрична: если роутер админки однажды окажется приоритетнее, он проглотит
# /studio целиком, и симптом будет не «Studio не работает», а «Studio отдаёт чужую
# страницу» — то есть то, что заметят не сразу.
#
# StripPrefix нет и не должно быть: приложение поднимается с UsePathBase("/studio") и
# ждёт префикс на входе. Снять его здесь значит сломать все ссылки внутри страницы.
#
# ── Чего здесь нет ────────────────────────────────────────────────────────────────
#
# Нет роутера на /v1. MarketData.Api сейчас наружу не опубликован ни для одного из
# контуров, и это отдельное решение, а не следствие переезда доменов.
#
# Нет middleware на админке — их не было и на роутере, который этот файл заменяет.
# Админка закрыта собственным логином (/admin отдаёт 302 на форму входа), и traefik
# перед ней ничего не проверяет. Это записано здесь, чтобы отсутствие basicauth
# читалось как решение, а не как забытая строка.
#
# ── Как проверить, что оно правда так маршрутизируется ────────────────────────────
#
# Код ответа не доказывает ничего: оба контура отдают 200, а страницы у них байт в
# байт одинаковы, пока данные совпадают. `ss` тоже не годится — соединения к бэкенду
# живут доли секунды и между выборками их не видно. Считать надо трафик на VPN:
#
#     rx() { awk -v i="wg1:" '$1==i{print $2}' /proc/net/dev; }
#     a=$(rx); curl -sk -o /dev/null --resolve cryptosmithx.blynai.eu:443:127.0.0.1 \
#         https://cryptosmithx.blynai.eu/studio; echo $(( $(rx) - a ))
#
# У прод-имени счётчик растёт, у -test не двигается вовсе. Ожидаемая величина мала и
# это не ошибка: бэкенд отдаёт gzip, и страница в 144 КиБ уезжает по проводу в 7,3 КиБ.
# Ждать «примерно размер страницы» — верный способ решить, что маршрут не работает,
# когда он работает.
#
# Резервные копии предыдущих версий — в /opt/traefik/dynamic-backups/, не рядом с
# конфигом. Traefik разбирает только .yml/.yaml/.toml/.json, так что `.bak.<дата>` он
# и не читал бы, но каталог, за которым он следит, — не место для черновиков.
# ──────────────────────────────────────────────────────────────────────────────────

http:
  routers:
    # ── прод, через VPN ───────────────────────────────────────────────────────────
    csx-prod-studio:
      rule: Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/studio`)
      priority: 100
      entryPoints: [websecure]
      service: csx-prod-studio
      tls:
        certResolver: letsencrypt

    csx-prod-admin:
      rule: Host(`cryptosmithx.blynai.eu`)
      priority: 10
      entryPoints: [websecure]
      service: csx-prod-admin
      tls:
        certResolver: letsencrypt

    # ── тест, локально ────────────────────────────────────────────────────────────
    csx-test-studio:
      rule: Host(`cryptosmithx-test.blynai.eu`) && PathPrefix(`/studio`)
      priority: 100
      entryPoints: [websecure]
      service: csx-test-studio
      tls:
        certResolver: letsencrypt

    csx-test-admin:
      rule: Host(`cryptosmithx-test.blynai.eu`)
      priority: 10
      entryPoints: [websecure]
      service: csx-test-admin
      tls:
        certResolver: letsencrypt

  services:
    csx-prod-studio:
      loadBalancer:
        servers:
          - url: http://10.11.12.28:7778
    csx-prod-admin:
      loadBalancer:
        servers:
          - url: http://10.11.12.28:7777
    csx-test-studio:
      loadBalancer:
        servers:
          - url: http://10.8.0.1:7778
    csx-test-admin:
      loadBalancer:
        servers:
          - url: http://10.8.0.1:7777
