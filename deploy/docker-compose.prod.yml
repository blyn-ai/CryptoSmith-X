# Prod compose for the Contabo VPS. Lives at /opt/cryptosmithx/docker-compose.yml —
# vps-deploy.sh refreshes it from this file on every deploy. Images come from GHCR
# (built by .github/workflows/deploy.yml); nothing is ever built on the VPS.
# Secrets live ONLY in /opt/cryptosmithx/.env (chmod 600), never in git.
#
# `name` groups every container under one "cryptosmithx" stack in docker/Portainer.
name: cryptosmithx

services:
  postgres:
    container_name: cryptosmithx-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketdata
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/cryptosmithx/.env}
    ports:
      # Loopback only — reach it through an ssh tunnel, never from the network.
      # 5432 on this host belongs to the old trading-bot stack.
      - "127.0.0.1:55432:5432"
    volumes:
      - /opt/cryptosmithx/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketdata -d marketdata"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-migrator:
    container_name: cryptosmithx-db-migrator
    image: ghcr.io/blyn-ai/cryptosmithx-migrator:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=${POSTGRES_PASSWORD}
    restart: "no"

  hub:
    container_name: cryptosmithx-marketdata-hub
    image: ghcr.io/blyn-ai/cryptosmithx-hub:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=${POSTGRES_PASSWORD}
      # Sentry errors (component=hub); DSN lives only in /opt/cryptosmithx/.env.
      Sentry__Dsn: ${SENTRY_DSN:-}
    restart: unless-stopped

  # The read-only /v1 surface, so the test contour answers the same four public addresses the
  # production one does. It was absent here while vm.yml had it, which meant /api on the test domain
  # had nowhere local to go and the only honest alternatives were a 404 or pointing the test site at
  # production's data — a test address serving production figures is worse than no test address.
  #
  # Published on the WireGuard address like its neighbours: never 0.0.0.0, because docker's published
  # ports bypass the host firewall.
  api:
    container_name: cryptosmithx-marketdata-api
    image: ghcr.io/blyn-ai/cryptosmithx-api:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      # Written out rather than shared through a YAML anchor: this file has no anchors and every
      # service states its own connection string. The block was lifted from docker-compose.vm.yml,
      # which does use one — and the paste took `<<: *db` with it, so the whole file stopped parsing
      # and every converge on the test host died with "unknown anchor 'db'".
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=${POSTGRES_PASSWORD}
      Sentry__Dsn: ${SENTRY_DSN:-}
    ports:
      # 7780, NOT 8080, and only on this host: 10.8.0.1:8080 was already taken here by an
      # unrelated container (freq-research) two weeks before this service existed. The port was
      # copied from the production compose, where 8080 is free, and never checked against this
      # machine — so docker could not program the binding, created the container with NO network
      # at all, and it restarted 433 times resolving `postgres` against nothing. A published port
      # that collides does not fail loudly; it fails as a DNS error inside the container.
      #
      # Production keeps 8080 (different host, nothing else on it). Traefik's csx-test-api points
      # here and the two have to move together.
      - "10.8.0.1:7780:8080"
    restart: unless-stopped

  webapp-admin:
    container_name: cryptosmithx-webapp-admin
    image: ghcr.io/blyn-ai/cryptosmithx-webapp-admin:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Production
      # Какая это ПЛОЩАДКА, а не какое окружение ASP.NET. Второе остаётся Production
      # и здесь: тест, работающий в другом режиме фреймворка, тестирует не то.
      Csx__Site: test
      # Sentry errors (component=webapp-admin).
      Sentry__Dsn: ${SENTRY_DSN:-}
      DataProtection__KeysDirectory: /keys
    volumes:
      - /opt/cryptosmithx/webapp-keys:/keys
    ports:
      # VPN fallback entrance. The public entrance is traefik on
      # cryptosmithx.blynai.eu (config lives in /opt/traefik/dynamic/).
      - "10.8.0.1:7777:8080"
    restart: unless-stopped

  # Studio — the public showcase at /studio. Its own container rather than another route on
  # the webapp-admin: the anonymous internet and the admin console have different availability
  # needs and different blast radii when one of them has a bad afternoon.
  studio:
    container_name: cryptosmithx-webapp-studio
    image: ghcr.io/blyn-ai/cryptosmithx-webapp-studio:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      # Пароль намеренно НЕ переименован вместе с ролью: 0025 задал роли значение
      # `arena_reader`, а `alter role ... rename to` в 0027 пароля не трогает — права
      # привязаны к OID, пароль к нему же. Строка, отправляющая `studio_reader`, не
      # подошла бы ни к одной существующей базе. Значение всё равно подлежит ротации на
      # каждом хосте: оно лежит в публичном репозитории.
      # studio_reader, not marketdata: a public surface must not hold a credential that is
      # allowed to insert. The role, its grants and the argument for both are migration 0025.
      #
      # The default matches the password 0025 sets when it creates the role. That works, but
      # it is not the finished setting: everyone who has seen the repository knows it, so
      # rotate the role on this host and put the real string in /opt/cryptosmithx/.env. The
      # default is deliberate all the same — this host redeploys automatically on every push
      # to main (vps-deploy.sh), and a required variable would take the whole stack down,
      # webapp-admin included, on the first such deploy after this file lands.
      ConnectionStrings__Database: ${STUDIO_DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=studio_reader;Password=arena_reader;Maximum Pool Size=20}
      ASPNETCORE_ENVIRONMENT: Production
      # Sentry errors (component=studio).
      Sentry__Dsn: ${SENTRY_DSN:-}
    ports:
      # VPN fallback entrance, as for the webapp-admin. The public entrance is traefik on
      # cryptosmithx.blynai.eu, whose dynamic config lives in /opt/traefik/dynamic/ and is
      # not part of this repository. The router there reads:
      #
      #     http:
      #       routers:
      #         csx-studio:
      #           rule: "Host(`cryptosmithx.blynai.eu`) && PathPrefix(`/studio`)"
      #           service: csx-studio
      #           priority: 100     # above the webapp-admin rule, or that one swallows /studio
      #       services:
      #         csx-studio:
      #           loadBalancer:
      #             servers: [{ url: "http://10.8.0.1:7778" }]
      #
      # With NO stripPrefix middleware. The application starts with UsePathBase("/studio")
      # and puts the prefix back into every link it generates. Two places stripping the same
      # prefix produce a correct URL only while both agree, and the day someone reorders the
      # proxy middleware every link on the site breaks at once — silently, and in production
      # only.
      - "10.8.0.1:7778:8080"
    restart: unless-stopped

  # The agent — the bot owner's own surface at /agent, behind a sign-in against webapp_user.
  #
  # Its connection string is the marketdata one, NOT studio_reader: the only table it reads is
  # webapp_user, which the reader role created by 0025 is not granted, so a sign-in against that
  # role would fail on the one query the application makes. Written out inline like every other
  # service here — this file has no YAML anchors, and the day one was pasted in from vm.yml the
  # whole stack stopped parsing.
  #
  # ONE trading bot serves both contours, which is the owner's instruction and not an oversight:
  # there is one bot, and a test copy of a page about it that talked to a different bot would be
  # showing figures nobody trades on. The address is public and unauthenticated today; it is a
  # setting rather than a literal so that stops being true without a rebuild.
  agent:
    container_name: cryptosmithx-webapp-agent
    image: ghcr.io/blyn-ai/cryptosmithx-webapp-agent:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=${POSTGRES_PASSWORD}
      # The bot's own database, reached by CONTAINER NAME across the bot stack's network — see the
      # networks block at the bottom of this file for why there is no other way in. The password is
      # the bot's, so it lives in /opt/cryptosmithx/.env and never here; required, with no fallback,
      # because a wrong-but-present credential fails at the first save instead of at start-up.
      ConnectionStrings__TradingBotDatabase: Host=trading-bot-db;Port=5432;Database=tradingbot;Username=tradingbot;Password=${TRADING_BOT_POSTGRES_PASSWORD:?пароль БД бота, из /opt/trading-bot/.env, положить в /opt/cryptosmithx/.env}
      TradingBot__BaseUrl: ${TRADING_BOT_BASE_URL:-https://blynai.meetluko.eu}
      ASPNETCORE_ENVIRONMENT: Production
      Sentry__Dsn: ${SENTRY_DSN:-}
      DataProtection__KeysDirectory: /keys
    networks:
      - default
      - trading-bot
    volumes:
      # Its own key directory, not the admin console's: the two apps set different
      # SetApplicationName values, so a shared ring would hold two key sets for no reason and
      # tie one app's redeploy to the other's sessions.
      - /opt/cryptosmithx/agent-keys:/keys
    ports:
      # VPN fallback entrance, as for its neighbours; the public entrance is traefik on
      # /agent, forwarded unstripped — the app strips it itself with UsePathBase.
      - "10.8.0.1:7779:8080"
    restart: unless-stopped

# The bot's network, joined rather than recreated. Its PostgreSQL publishes on 127.0.0.1:5432 of
# this host and nothing else, and a container cannot reach the host's loopback — so the only way in
# without touching the bot's own stack is to stand on its network and address the container by name.
#
# THIS COUPLES THE TWO STACKS: `external: true` means docker refuses to bring anything up here if
# that network is gone. It is the honest shape of the dependency — the parameters page edits the
# bot's database, so an agent that started cheerfully without a route to it would be a form that
# saves into nothing. If the bot stack is ever retired, this block and the agent's second network
# go with it.
networks:
  trading-bot:
    name: trading-bot_default
    external: true
