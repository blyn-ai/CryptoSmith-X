name: cryptosmithx

services:
  postgres:
    container_name: cryptosmithx-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketdata}
      POSTGRES_USER: ${POSTGRES_USER:-marketdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdata}
    volumes:
      # Postgres data on the host, under CSX_DATA_ROOT (an external disk locally; see .env).
      # Defaults to deploy/data so a bare checkout still runs without configuration.
      - ${CSX_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketdata} -d ${POSTGRES_DB:-marketdata}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the schema, then exits. Hub and api wait for it to complete successfully.
  database-migrator:
    container_name: cryptosmithx-db-migrator
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    restart: "no"

  hub:
    container_name: cryptosmithx-marketdata-hub
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: hub
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    restart: unless-stopped

  api:
    container_name: cryptosmithx-marketdata-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    ports:
      - "8080:8080"
    restart: unless-stopped

  webapp:
    container_name: cryptosmithx-webapp
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: webapp
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
      # Development enables local conveniences; sign-in accounts live in the database either way.
      ASPNETCORE_ENVIRONMENT: ${WEBAPP_ENVIRONMENT:-Development}
      # DataProtection keys must survive a restart, or every redeploy logs everyone out.
      DataProtection__KeysDirectory: /keys
    volumes:
      - ${CSX_DATA_ROOT:-./data}/webapp-keys:/keys
    ports:
      - "8081:8080"
    restart: unless-stopped
