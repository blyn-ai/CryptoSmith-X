name: cryptosmithx-marketdata

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketdata}
      POSTGRES_USER: ${POSTGRES_USER:-marketdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdata}
    volumes:
      - marketdata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketdata} -d ${POSTGRES_DB:-marketdata}"]
      interval: 5s
      timeout: 3s
      retries: 20

  marketdata:
    build:
      # The repository root, so src/web/ds is reachable by the linked content.
      context: ..
      dockerfile: deploy/marketdata.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__MarketData: ${MARKETDATA_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  marketdata-pgdata:
