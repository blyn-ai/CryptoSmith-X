name: cryptosmithx-marketdata

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketdata}
      POSTGRES_USER: ${POSTGRES_USER:-marketdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdata}
    volumes:
      - marketdata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketdata} -d ${POSTGRES_DB:-marketdata}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the schema, then exits. Hub and api wait for it to complete successfully.
  database-migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    restart: "no"

  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: hub
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  marketdata-pgdata:
