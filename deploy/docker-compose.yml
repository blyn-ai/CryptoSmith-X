name: cryptosmithx

services:
  postgres:
    container_name: cryptosmithx-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketdata}
      POSTGRES_USER: ${POSTGRES_USER:-marketdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdata}
    ports:
      # Loopback only: for DataGrip/psql on this machine, never for the LAN.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres data on the host, under CSX_DATA_ROOT (an external disk locally; see .env).
      # Defaults to deploy/data so a bare checkout still runs without configuration.
      - ${CSX_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketdata} -d ${POSTGRES_DB:-marketdata}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the schema, then exits. Hub and api wait for it to complete successfully.
  database-migrator:
    container_name: cryptosmithx-db-migrator
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
    restart: "no"

  hub:
    container_name: cryptosmithx-marketdata-hub
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: hub
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
      # Sentry errors (component=hub). Empty locally → SDK stays disabled.
      Sentry__Dsn: ${SENTRY_DSN:-}
    restart: unless-stopped

  api:
    container_name: cryptosmithx-marketdata-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
      # Sentry errors (component=api). Empty locally → SDK stays disabled.
      Sentry__Dsn: ${SENTRY_DSN:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  webapp-admin:
    container_name: cryptosmithx-webapp-admin
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: webapp-admin
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=marketdata;Password=marketdata}
      # Sentry errors (component=webapp-admin). Empty locally → SDK stays disabled.
      Sentry__Dsn: ${SENTRY_DSN:-}
      # Development enables local conveniences; sign-in accounts live in the database either way.
      ASPNETCORE_ENVIRONMENT: ${WEBAPP_ENVIRONMENT:-Development}
      # DataProtection keys must survive a restart, or every redeploy logs everyone out.
      DataProtection__KeysDirectory: /keys
    volumes:
      - ${CSX_DATA_ROOT:-./data}/webapp-keys:/keys
    ports:
      - "8081:8080"
    restart: unless-stopped

  # The public showcase. Its own container, not another route on the webapp-admin: the two have
  # different audiences (anonymous internet vs. signed-in operators), different availability
  # expectations and different scale, and a bad afternoon on one should not be a bad afternoon
  # on the other.
  #
  # No healthcheck, and that is the same choice the webapp-admin and the api made above: the
  # aspnet:10.0 image ships neither curl nor wget, so a healthcheck here would mean installing
  # a network client into the runtime image of the one service the whole internet can reach.
  # Compose ordering already gates the start on the migrator, and the app refuses to serve on a
  # schema that is behind.
  studio:
    container_name: cryptosmithx-studio
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: studio
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      # studio_reader, not marketdata: a public surface must not hold a credential that can write.
      # The role, the grants and the argument are migration 0025; the local default password
      # matches the one that migration sets when it creates the role.
      ConnectionStrings__Database: ${STUDIO_DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=marketdata;Username=studio_reader;Password=arena_reader;Maximum Pool Size=20}
      # Sentry errors (component=studio). Empty locally → SDK stays disabled.
      Sentry__Dsn: ${SENTRY_DSN:-}
      ASPNETCORE_ENVIRONMENT: ${STUDIO_ENVIRONMENT:-Development}
    ports:
      # The app serves under /studio (UsePathBase), so the local address is
      # http://localhost:8082/studio — traefik forwards the prefix unstripped in front of the
      # deployed one, and a local port that behaved differently would hide exactly that.
      - "8082:8080"
    restart: unless-stopped
