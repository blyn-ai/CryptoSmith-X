# Compose for the VM inside the client's network (b-csx-datahub) — the machine that
# is becoming production. Lives at /opt/cryptosmithx/docker-compose.yml; the prod job
# in .github/workflows/deploy.yml refreshes it from this file on every deploy.
#
# The one structural difference from docker-compose.prod.yml: PostgreSQL is NOT a
# container here. It runs on the host, installed by deploy/provision-host.sh, so its
# lifecycle is independent of deploys and `docker compose down` cannot reach it.
# Containers talk to it over the `csx` bridge, whose subnet is fixed precisely so
# Postgres can listen on that one gateway address and nothing else.
#
# Secrets live ONLY in /opt/cryptosmithx/.env (chmod 600), never in git.
name: cryptosmithx

x-db: &db
  ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?есть в /opt/cryptosmithx/.env}

networks:
  default:
    name: ${CSX_NETWORK:-csx}
    external: true

services:
  database-migrator:
    container_name: cryptosmithx-db-migrator
    image: ghcr.io/blyn-ai/cryptosmithx-migrator:latest
    environment: *db
    restart: "no"

  hub:
    container_name: cryptosmithx-marketdata-hub
    image: ghcr.io/blyn-ai/cryptosmithx-hub:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      <<: *db
      Sentry__Dsn: ${SENTRY_DSN:-}
    restart: unless-stopped

  api:
    container_name: cryptosmithx-marketdata-api
    image: ghcr.io/blyn-ai/cryptosmithx-api:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      <<: *db
      Sentry__Dsn: ${SENTRY_DSN:-}
    ports:
      # Only on the WireGuard address. Binding 0.0.0.0 would publish it to the
      # client's LAN, and docker's published ports bypass the host firewall.
      - "10.11.12.28:8080:8080"
    restart: unless-stopped

  webapp-admin:
    container_name: cryptosmithx-webapp-admin
    image: ghcr.io/blyn-ai/cryptosmithx-webapp-admin:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      <<: *db
      ASPNETCORE_ENVIRONMENT: Production
      Csx__Site: production
      Sentry__Dsn: ${SENTRY_DSN:-}
      DataProtection__KeysDirectory: /keys
    volumes:
      - /opt/cryptosmithx/webapp-keys:/keys
    ports:
      # Same rule as the api: the tunnel address, never the LAN.
      - "10.11.12.28:7777:8080"
    restart: unless-stopped

  # Studio — the public showcase at /studio, in its own container for the same reason it is
  # one everywhere else: the anonymous internet and the admin console fail differently.
  studio:
    container_name: cryptosmithx-studio
    image: ghcr.io/blyn-ai/cryptosmithx-studio:latest
    depends_on:
      database-migrator:
        condition: service_completed_successfully
    environment:
      # NOT *db. That anchor carries the marketdata credential, which owns the schema; a
      # public surface must not hold one that can write. Migration 0025 has the role, the
      # grant list and the argument.
      #
      # Required, with no default, and that is the one place this file differs from
      # docker-compose.prod.yml. Postgres here runs on the host, so its address is the
      # docker gateway and lives only inside DATABASE_CONNECTION_STRING in
      # /opt/cryptosmithx/.env — there is no correct literal to fall back to. And on this
      # host the schema owner has no CREATEROLE (provision-host.sh created it as
      # `create role marketdata login`), so 0025 cannot create studio_reader either: an
      # operator does it once as postgres, with a generated password, and writes the string
      # here. Before that first deploy, add to /opt/cryptosmithx/.env:
      #
      #     STUDIO_DATABASE_CONNECTION_STRING=Host=<gateway>;Port=5432;Database=marketdata;Username=studio_reader;Password=<generated>;Maximum Pool Size=20
      #
      # A loud refusal to start beats a public site quietly running as the schema owner.
      ConnectionStrings__Database: ${STUDIO_DATABASE_CONNECTION_STRING:?studio_reader, не marketdata — см. миграцию 0025; строка в /opt/cryptosmithx/.env}
      ASPNETCORE_ENVIRONMENT: Production
      Sentry__Dsn: ${SENTRY_DSN:-}
    ports:
      # Same rule as the api and the webapp-admin: the tunnel address, never the LAN. The public
      # entrance is the proxy, which forwards /studio unstripped — the app strips it itself
      # with UsePathBase, and two places stripping one prefix is a link that breaks the day
      # someone reorders middleware.
      - "10.11.12.28:7778:8080"
    restart: unless-stopped
