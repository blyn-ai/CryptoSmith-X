name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # TreatWarningsAsErrors is set project-side; test builds the solution first.
      - run: dotnet test CryptoSmithX.sln --nologo
